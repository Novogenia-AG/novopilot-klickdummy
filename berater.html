<style>
/* Design 1:1 aus der GENEius-App (DESIGN-VARIANTEN-2026-10/v21-report-app.html) */
:root{
  --bg0:#3C0033;--bg1:#12000E;--plum:#5E0047;--berry:#8C1D6E;--lime:#C6D63F;--lime-d:#9DB01B;--lime-ink:#26001D;
  --ink:#241F2C;--soft:#675E6E;--line:rgba(94,0,71,.12);--wash:#F7F1F5;
  --r:24px;--sh:0 22px 44px -22px rgba(8,0,6,.7),0 2px 8px rgba(8,0,6,.14);
  --f:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;--num:'Archivo Black','Montserrat',sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
html{background:linear-gradient(180deg,#3C0033 0%,#25001E 50%,#12000E 100%) fixed #12000E;-webkit-text-size-adjust:100%}
body{font-family:var(--f);color:#fff;background:transparent;-webkit-font-smoothing:antialiased;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px;border-radius:12px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.aurora{position:fixed;inset:-25%;z-index:0;pointer-events:none;
  background:radial-gradient(80% 50% at 15% 0%,rgba(140,29,110,.45),transparent 70%),
             radial-gradient(60% 40% at 100% 8%,rgba(198,214,63,.10),transparent 70%),
             radial-gradient(70% 45% at 85% 95%,rgba(140,29,110,.26),transparent 70%),
             radial-gradient(50% 35% at 5% 70%,rgba(94,0,71,.35),transparent 70%);
  animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(4%,2%,0) scale(1.06)}100%{transform:translate3d(-3%,5%,0) scale(1.03)}}
.mtop{position:fixed;top:0;left:0;right:0;z-index:30;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.mtop.solid{background:rgba(40,0,33,.78);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom-color:rgba(255,255,255,.1)}
.mtop-in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.14em}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px rgba(198,214,63,.7)}
.swipe,.dots{touch-action:none;-webkit-user-select:none;user-select:none}
.mtop{touch-action:manipulation}
.legal{margin-left:auto;font-size:11px;font-weight:600;color:rgba(255,255,255,.62);text-decoration:none;padding:6px 2px}
.legal+.seg{margin-left:0}
.legal-f{margin-top:10px;text-align:center;font-size:11.5px}
.legal-f a{color:rgba(255,255,255,.6);text-decoration:underline;text-underline-offset:2px;margin:0 6px}
.seg{margin-left:auto;display:inline-flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14)}
.seg button{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:rgba(255,255,255,.8);transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--lime);color:var(--lime-ink)}
.prog{height:3px;background:rgba(255,255,255,.08)}
.prog i{display:block;height:100%;background:var(--lime);box-shadow:0 0 10px rgba(198,214,63,.6);transition:width .6s var(--ease)}
.deck{position:fixed;inset:0;z-index:1}
.track{position:absolute;inset:0;transition:transform .7s cubic-bezier(.65,0,.25,1);will-change:transform}
.page{position:absolute;left:0;right:0;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.page::-webkit-scrollbar{display:none}
.pin{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(84px + env(safe-area-inset-top)) 22px calc(92px + env(safe-area-inset-bottom))}
.pin.top{justify-content:flex-start}
@media (max-height:760px){.pin{padding-top:calc(70px + env(safe-area-inset-top));padding-bottom:calc(78px + env(safe-area-inset-bottom))}.hero-txt{padding-bottom:calc(80px + env(safe-area-inset-bottom))}.swipe{bottom:calc(8px + env(safe-area-inset-bottom))}}
@media (max-width:360px){.pin{padding-left:16px;padding-right:16px}.hero-txt{padding-left:16px;padding-right:16px}}
.page .anim{opacity:0}
.page.on .anim{animation:fadeSlideUp .7s var(--ease) both}
.page.on .a1{animation-delay:.12s}.page.on .a2{animation-delay:.24s}.page.on .a3{animation-delay:.36s}.page.on .a4{animation-delay:.48s}.page.on .a5{animation-delay:.6s}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:52% 28%;animation:kenburns 18s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1.04)}to{transform:scale(1.14) translate(-1%,-1.5%)}}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,0,14,.6) 0%,rgba(18,0,14,0) 20%,rgba(18,0,14,0) 36%,rgba(37,0,30,.85) 64%,#25001E 100%),radial-gradient(110% 55% at 50% 100%,rgba(140,29,110,.55),transparent 70%)}
.hero-txt{position:absolute;left:0;right:0;bottom:0;padding:0 22px calc(96px + env(safe-area-inset-bottom))}
.hero-txt .in{max-width:480px;margin:0 auto}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--lime)}
.h1{font-size:clamp(34px,10vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.h2{font-size:clamp(23px,6.4vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.14;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.lead{color:rgba(255,255,255,.82);font-size:15.5px}
.hero-box{position:relative;border-radius:28px;padding:22px 20px 20px;overflow:hidden;background:var(--plum);border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 48px -32px rgba(0,0,0,.65)}
.card{background:linear-gradient(165deg,#fff 60%,#FBF7FA);box-shadow:var(--sh);border-radius:var(--r);color:var(--ink);overflow:hidden;position:relative}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--plum);color:#fff;box-shadow:0 10px 18px -8px rgba(94,0,71,.55)}
.ico.lime{background:var(--lime);color:var(--lime-ink);box-shadow:0 10px 18px -8px rgba(140,160,10,.7)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.35}
.p-glass{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .18s var(--ease),background .18s,box-shadow .18s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.lime{background:var(--lime);color:var(--lime-ink);box-shadow:0 10px 22px -10px rgba(198,214,63,.8)}
.btn.glass{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
.btn.block{width:100%}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--soft);line-height:1.45}
.chk .ic{width:16px;height:16px;color:var(--plum);margin-top:2px}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:18px;padding:14px 16px;font-size:13.5px;line-height:1.5;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.88)}
.note .ic{color:var(--lime);margin-top:1px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{background:linear-gradient(165deg,#fff 60%,#FBF7FA);border-radius:20px;box-shadow:var(--sh);color:var(--ink);padding:16px 4px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;font-weight:700;line-height:1.2;text-align:center;transition:transform .25s var(--ease),box-shadow .25s}
.opt:active{transform:scale(.96)}
.opt.sel{box-shadow:0 0 0 3px var(--lime),0 18px 36px -16px rgba(198,214,63,.55);transform:translateY(-4px)}
.opt.sel .face{animation:bounce .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bounce{0%{transform:scale(.7)}100%{transform:scale(1)}}
.opt2{flex-direction:row;justify-content:flex-start;gap:14px;text-align:left;padding:16px}
.shake{animation:shake .45s!important}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.swipe{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,.8);font-size:10.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;padding:6px 16px;white-space:nowrap}
.swipe .ic{width:26px;height:26px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(4px);opacity:.4}50%{transform:translateY(-6px);opacity:1}}
.dots{position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:6px}
.dots i{width:5px;height:5px;border-radius:999px;background:rgba(255,255,255,.28);transition:all .4s var(--ease)}
.dots i.on{height:18px;background:var(--lime)}
.hint{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:25;background:var(--lime);color:var(--lime-ink);font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 10px 22px -10px rgba(198,214,63,.8)}
.gift{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px;background:var(--plum);border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 48px -26px rgba(0,0,0,.8)}
.gift::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.16) 50%,transparent 58%);animation:sweep 3.6s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%{transform:translateX(-60%)}60%,100%{transform:translateX(60%)}}
.num{font-family:var(--num);letter-spacing:-.01em;line-height:1}
.code{flex:1;min-width:0;border-radius:16px;background:#fff;color:var(--plum);font-family:var(--num);font-size:clamp(13px,4.2vw,20px);letter-spacing:.03em;padding:13px 6px;text-align:center;white-space:nowrap;overflow:hidden;border:2px dashed rgba(94,0,71,.35);user-select:all}
.thumb{width:64px;height:64px;object-fit:contain;flex:none;filter:drop-shadow(0 6px 8px rgba(36,31,44,.25))}
.card.vis{overflow:visible}
.stage{position:relative;height:170px;margin-top:-84px;display:flex;justify-content:center;align-items:flex-end;pointer-events:none}
.stage::before{content:"";position:absolute;left:18%;right:18%;bottom:2px;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(36,31,44,.28),transparent);filter:blur(2px)}
.stage img{position:relative;max-height:170px;max-width:96%;object-fit:contain;filter:drop-shadow(0 18px 22px rgba(18,0,14,.35));animation:float 5s ease-in-out infinite}
.page.on .stage img{animation:rise .9s cubic-bezier(.2,.9,.3,1.2) .25s both,float 5s ease-in-out 1.2s infinite}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sticker{position:absolute;right:18px;top:calc(76px + env(safe-area-inset-top));width:118px;height:118px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 16px 34px -12px rgba(198,214,63,.75);transform:rotate(-10deg);z-index:2}
.page.on .sticker{animation:stick .9s cubic-bezier(.3,1.6,.5,1) .5s both}
@keyframes stick{from{opacity:0;transform:scale(.3) rotate(-40deg)}to{opacity:1;transform:rotate(-10deg)}}
.sticker .num{font-size:34px}
.sticker small{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.15;margin-top:3px}
.bigoff{display:flex;align-items:center;gap:16px}
.bigoff .num{font-size:64px;color:var(--lime)}
.page.on .pop{animation:pop .8s cubic-bezier(.3,1.5,.5,1) .45s both}
@keyframes pop{from{opacity:0;transform:scale(.7) rotate(-3deg)}to{opacity:1;transform:none}}
.vov{position:fixed;inset:0;z-index:50;overflow-y:auto;background:rgba(18,0,14,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:vIn .35s var(--ease) both}
.vin{max-width:480px;margin:0 auto;padding:calc(76px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom));animation:fadeSlideUp .45s var(--ease) both}
@keyframes vIn{from{opacity:0}to{opacity:1}}
.vov .gift{animation:pop .8s cubic-bezier(.3,1.5,.5,1) .15s both}
.allp{display:block;width:100%;transition:transform .18s var(--ease)}
.allp:active{transform:scale(.98)}
.chatb{position:fixed;right:max(14px,calc(50vw - 240px + 14px));bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chatbtn{position:relative;width:56px;height:56px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;box-shadow:0 12px 26px -10px rgba(198,214,63,.9),0 0 0 4px rgba(198,214,63,.18);animation:bubIn .6s cubic-bezier(.3,1.6,.5,1) both}
.chatbtn::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 rgba(198,214,63,.55);animation:ring 2.6s ease-out infinite}
.chatl{background:#fff;color:var(--ink);font-size:12px;font-weight:700;padding:8px 12px;border-radius:14px 14px 4px 14px;box-shadow:var(--sh);max-width:180px;line-height:1.25;text-align:left;animation:fadeSlideUp .5s var(--ease) .3s both}
@keyframes bubIn{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(198,214,63,.5)}80%,100%{box-shadow:0 0 0 16px rgba(198,214,63,0)}}
.price{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:4px}
.price .was{font-size:13px;color:var(--soft);text-decoration:line-through;text-decoration-color:rgba(94,0,71,.5)}
.price .extra{font-size:12px;color:var(--soft)}
.price .now{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.price .now b{font-family:var(--num);font-size:19px;color:var(--plum);letter-spacing:-.01em}
.price .now b.day{font-size:24px}
.price .tag{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--lime);color:var(--lime-ink);padding:3px 8px;border-radius:999px}
.rank{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-size:12px;font-weight:800;margin-bottom:6px}
.endswipe{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(255,255,255,.75);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.endswipe .ic{animation:nudge 1.6s ease-in-out infinite}
.conf{position:fixed;top:-12px;width:9px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.page .anim{opacity:1}}
</style>

/* Passt jede Seite in die Bildschirmhöhe (z. B. Fold-Außendisplay): Inhalt wird bei Bedarf verkleinert statt abgeschnitten. */
function fitPages(root){
  if(!root)return;
  const head=(document.querySelector('.mtop')||{}).offsetHeight||56;
  root.querySelectorAll('.page').forEach(pg=>{
    const H=pg.clientHeight;if(!H)return;
    const pin=pg.querySelector('.pin:not(.top)'),ht=pg.querySelector('.hero-txt');
    if(pin){
      pin.style.zoom='';pin.style.minHeight='0';pin.style.paddingTop='';pin.style.paddingBottom='';
      /* nur der Inhalt wird verkleinert, die Abstände zu Kopfzeile und Wisch-Symbol bleiben gleich */
      const cs=getComputedStyle(pin),pt=parseFloat(cs.paddingTop),pb=parseFloat(cs.paddingBottom);
      const z=Math.max(.55,Math.min(1,(H-pt-pb)/(pin.offsetHeight-pt-pb)));
      if(z<1){pin.style.zoom=String(z);pin.style.paddingTop=(pt/z)+'px';pin.style.paddingBottom=(pb/z)+'px';pin.style.minHeight=(H/z)+'px'}
      else pin.style.minHeight='';
    }else if(ht){
      ht.style.zoom='';ht.style.paddingBottom='';
      const pb=parseFloat(getComputedStyle(ht).paddingBottom);
      const z=Math.max(.55,Math.min(1,(H-head-12-pb)/(ht.offsetHeight-pb)));
      if(z<1){ht.style.zoom=String(z);ht.style.paddingBottom=(pb/z)+'px'}
    }
  });
}

/* Rangliste: nur Produkte, die zur Ausgangslage passen.
   Ohne vorhandene Genanalyse: nie NovoDailies einzeln und kein Upgrade (beides setzt eine Analyse voraus). */
function rank(a){
  const v=k=>a[k]===undefined?1:a[k], nem=a.nem==='yes';
  const W=v('weight')===2, N=v('nutrition')===2||v('young')===2||v('stress')===2, Sp=v('sport')===2;
  const anySport=v('sport')>0, anyWeight=v('weight')>0;
  let list;
  if(a.exist==='yes'){
    /* Was deckt die vorhandene Analyse schon ab, und welche Upgrades bringen etwas Neues? */
    const has=a.which||'unknown';
    const cov={shape:{W:1},lifestyle:{W:1,N:1},performance:{W:1,N:1,Sp:1},unknown:{}}[has];
    const useful={shape:['upLifestyle','upgrade','upPerformance'],lifestyle:['upgrade'],performance:[],unknown:['upgrade','upPerformance','upLifestyle','upShape']}[has]
      .filter(id=>(id==='upgrade'||id==='upPerformance')?anySport:id==='upShape'?anyWeight:true);
    const refillOK=nem&&has!=='shape';
    const first=(Sp&&!cov.Sp&&useful.includes('upgrade'))?'upgrade'
      :(N&&!cov.N&&useful.includes('upLifestyle'))?'upLifestyle'
      :(W&&!cov.W&&useful.includes('upShape'))?'upShape'
      :refillOK?'refill':useful[0];
    list=[first,refillOK&&'refill',...useful].filter(Boolean);
  }else{
    /* kleinstes Paket, das alle "sehr wichtig"-Themen abdeckt: Shape < Lifestyle < Performance */
    const first=Sp?'performance':N?'lifestyle':W?'shape':'lifestyle';
    const order={shape:['lifestyle','performance'],lifestyle:['performance','shape'],performance:['lifestyle','shape']}[first];
    list=[first,...order.filter(id=>id==='lifestyle'||(id==='performance'&&anySport)||(id==='shape'&&anyWeight))];
    if(!nem) list=list.map(id=>id+'A');
  }
  return [...new Set(list)];
}

    const atTop=()=>{const p=pg();return !p||p.scrollTop<=1};
    const atBot=()=>{const p=pg();return !p||p.scrollTop+p.clientHeight>=p.scrollHeight-2};
    /* fest stehende Elemente (Wisch-Symbol, Punkte, Kopfzeile) liegen über keiner scrollbaren Fläche: der Browser bricht die Geste dort
       oft mit touchcancel ab statt touchend zu senden. Darum letzte Position aus touchmove merken und auch bei touchcancel auswerten. */
    const fixedEl=t=>t&&t.closest&&t.closest('.swipe,.dots,.mtop,.chatb');
    const ts=e=>{const p=e.touches[0];st={y:p.clientY,x:p.clientX,ly:p.clientY,lx:p.clientX,top:fixedEl(e.target)?true:atTop(),bot:fixedEl(e.target)?true:atBot()}};
    const tm=e=>{if(st&&e.touches[0]){st.ly=e.touches[0].clientY;st.lx=e.touches[0].clientX}};
    const fin=(y,x)=>{if(!st)return;const dy=y-st.y,dx=x-st.x;
      if(Math.abs(dy)>40&&Math.abs(dy)>Math.abs(dx)){window.__sw=Date.now();if(dy<0&&st.bot)go(R.current.i+1);else if(dy>0&&st.top)go(R.current.i-1)}st=null};
    const te=e=>{const p=e.changedTouches&&e.changedTouches[0];p?fin(p.clientY,p.clientX):st&&fin(st.ly,st.lx)};
    const tc=()=>{st&&fin(st.ly,st.lx)};
    const wh=e=>{const now=Date.now();if(Math.abs(e.deltaY)<20||now-wheelT<900)return;
      if(e.deltaY>0&&atBot()){wheelT=now;go(R.current.i+1)}else if(e.deltaY<0&&atTop()){wheelT=now;go(R.current.i-1)}};
    const kd=e=>{if(['ArrowDown','PageDown'].includes(e.key)){e.preventDefault();go(R.current.i+1)}if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(R.current.i-1)}};
    /* auf window statt nur auf dem Deck: so wischt es auch, wenn der Finger auf dem Wisch-Symbol, den Punkten oder der Kopfzeile startet */
    const W=window;
    W.addEventListener('touchstart',ts,{passive:true});W.addEventListener('touchmove',tm,{passive:true});W.addEventListener('touchend',te,{passive:true});W.addEventListener('touchcancel',tc,{passive:true});W.addEventListener('wheel',wh,{passive:true});W.addEventListener('keydown',kd);
    return()=>{W.removeEventListener('touchstart',ts);W.removeEventListener('touchmove',tm);W.removeEventListener('touchend',te);W.removeEventListener('touchcancel',tc);W.removeEventListener('wheel',wh);W.removeEventListener('keydown',kd)};
  },[go]);
  useLayoutEffect(()=>{fitPages(deck.current)},[i,lang,pages.join(),JSON.stringify(ans)]);
  useEffect(()=>{
    let raf=0;const f=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>fitPages(deck.current))};
    window.addEventListener('resize',f);window.addEventListener('orientationchange',f);window.addEventListener('load',f);
    if(window.visualViewport)visualViewport.addEventListener('resize',f);
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(f);
    return()=>{window.removeEventListener('resize',f);window.removeEventListener('orientationchange',f);window.removeEventListener('load',f);if(window.visualViewport)visualViewport.removeEventListener('resize',f)};
  },[]);

  const qi=STEPS.indexOf(qOf(cur));
  const progress=cur==='hero'?0:cur==='circle'?6:cur==='reco'?10:qi>=0?Math.round(14+qi/STEPS.length*80):cur==='doctor'?Math.round(14+STEPS.indexOf('disease')/STEPS.length*80):100;
  const showSwipe=!exit&&cur!=='final'&&cur!=='results'&&!(qOf(cur)&&ans[qOf(cur)]===undefined);

  return html`
  <header class=${'mtop'+(i>0?' solid':'')}>
    <div class="mtop-in">
      <span class="brand"><i></i>NOVODAILY</span>
      <a class="legal" href=${SHOP+'/impressum/'} target="_blank" rel="noopener noreferrer">${t.imprint}</a>
      <div class="seg" role="group" aria-label="Sprache / language">
        <button aria-pressed=${lang==='de'} onClick=${()=>setLang('de')}>DE</button>
        <button aria-pressed=${lang==='en'} onClick=${()=>setLang('en')}>EN</button>
      </div>
    </div>
    ${i>0&&html`<div class="prog"><i style=${{width:progress+'%'}}></i></div>`}
  </header>
  <div class="deck" ref=${deck}>
    <div class="track" style=${{transform:`translateY(${-i*100}%)`}}>
      ${pages.map((p,n)=>html`<section key=${p} class=${'page'+(n===i?' on':'')} style=${{top:n*100+'%'}} aria-hidden=${n!==i}>
        ${p==='hero'?html`<${Hero} t=${t}/>`
        :p==='circle'?html`<${Circle} t=${t}/>`
        :p==='reco'?html`<${Reco} t=${t} onBuy=${()=>setExit('lifestyle')}/>`
        :p==='doctor'?html`<${Doctor} t=${t}/>`
        :p==='results'?html`<${Results} t=${t} lang=${lang} recs=${recs} ans=${ans} active=${n===i} onBuy=${setExit}/>`
        :p==='soon'?html`<${Soon} t=${t}/>`
        :p==='final'?html`<${Final} t=${t} lang=${lang} onBuy=${setExit} ans=${ans} onRestart=${()=>{setAns({});lock.current=0;setI(3)}}/>`
        :html`<${Quiz} t=${t} k=${qOf(p)} idx=${STEPS.indexOf(qOf(p))} total=${STEPS.length} val=${ans[qOf(p)]} onPick=${pick} shake=${n===i?shake:0}/>`}
      </section>`)}
    </div>
  </div>
  <div class="dots" aria-hidden="true">${pages.map((_,n)=>html`<i key=${n} class=${n===i?'on':''}></i>`)}</div>
  ${showSwipe&&html`<button class="swipe" onClick=${()=>{if(Date.now()-(window.__sw||0)<800)return;lock.current=0;go(i+1)}} aria-label=${t.swipe}><${Icon} n="chevup"/>${t.swipe}</button>`}
  ${hint&&html`<div class="hint">${t.pickFirst}</div>`}
  ${exit&&html`<${Voucher} t=${t} lang=${lang} id=${exit} onClose=${()=>setExitRaw(null)}/>`}
  ${!exit&&cur!=='hero'&&html`<${ChatBubble} key=${cur} t=${t} label=${cur==='reco'||cur==='results'||cur==='soon'}/>`}`;
}

function PriceTag({id,lang}){
  const pr=PRICE[id]; if(!pr) return null; const t=T[lang];
  const base=pr.m||pr.from, disc=Math.round(base*(100-DISCOUNT))/100;
  const fmt=v=>pr.m?t.pMonth(eur(v,lang)):t.pFrom(eur(v,lang));
  const extra=pr.run?' · '+t.pRun(pr.run):pr.bind?' · '+t.pBind(pr.bind):'';
  if(pr.m){
    /* Abo: Preis pro Tag gross, pro Monat klein darunter (Monat x 12 / 365) */
    const day=v=>(Math.round(v*12/365*100)/100).toLocaleString(lang==='de'?'de-AT':'en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
    const v=NOV?base:disc;
    return html`<div class="price">
      ${!NOV&&html`<div><span class="was">${t.pDay(day(base))}</span></div>`}
      <div class="now">${!NOV&&html`<span class="tag">${t.pWith(DISCOUNT)}</span>`}<b class="day">${t.pDay(day(v))}</b></div>
      <div class="extra">${t.pMonth(eur(v,lang))}${extra}</div>
    </div>`;
  }
  if(NOV) return html`<div class="price"><div class="now"><b>${fmt(base)}</b><span class="extra">${extra}</span></div></div>`;
  return html`<div class="price">
    <div><span class="was">${fmt(base)}</span><span class="extra">${extra}</span></div>
    <div class="now"><span class="tag">${t.pWith(DISCOUNT)}</span><b>${fmt(disc)}</b></div>
  </div>`;
}

    ${notes.length>0&&html`<div class="anim a3" style=${{display:'grid',gap:'10px',marginTop:'16px'}}>${notes.map((n,j)=>html`<div key=${j} class="note"><${Icon} n="info"/><span>${n}</span></div>`)}</div>`}
    <div class="hero-box" style=${{marginTop:'16px',background:'rgba(255,255,255,.07)'}}>
      <div style=${{display:'flex',gap:'14px',alignItems:'flex-start'}}>
        <span class="ico lime"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg></span>
        <p style=${{fontSize:'14px',lineHeight:1.5,color:'rgba(255,255,255,.88)'}}>${t.chatSub}</p>
      </div>
      <button onClick=${openAdvisor} class="btn glass block" style=${{marginTop:'14px'}}>${t.chatBtn}<${Icon} n="arrow"/></button>
    </div>
    <p class="eyebrow" style=${{marginTop:'28px'}}>${t.allKicker}</p>
    <p style=${{marginTop:'6px',fontSize:'13px',color:'rgba(255,255,255,.7)'}}>${t.allSub}</p>
    ${[[t.grpAbo,['lifestyle','performance','shape']],[t.grpA,['lifestyleA','performanceA','shapeA']],[t.grpUp,['upgrade','upLifestyle','upShape','upPerformance','refill']]].map(([g,ids])=>html`<div key=${g} style=${{marginTop:'16px'}}>
      <p style=${{fontSize:'12px',fontWeight:800,letterSpacing:'.08em',textTransform:'uppercase',color:'rgba(255,255,255,.6)',marginBottom:'8px'}}>${g}</p>
      <div style=${{display:'grid',gap:'10px'}}>${ids.map(id=>html`<button key=${id} onClick=${()=>onBuy(id)} class="allp" style=${{textAlign:'left'}}><${ProductCard} id=${id} lang=${lang}/></button>`)}</div>
    </div>`)}
    <a href=${SHOP+'/'} target="_blank" rel="noopener noreferrer" class="btn glass block" style=${{marginTop:'18px',fontSize:'15px'}}>${t.toShop}<${Icon} n="arrow"/></a>
    <div style=${{textAlign:'center',marginTop:'18px'}}><button onClick=${onRestart} class="btn glass"><${Icon} n="back"/>${t.restart}</button></div>
    <p style=${{marginTop:'18px',textAlign:'center',fontSize:'11.5px',color:'rgba(255,255,255,.55)'}}>${t.foot}</p>
    <p class="legal-f"><a href=${SHOP+'/impressum/'} target="_blank" rel="noopener noreferrer">${t.imprint}</a><a href=${SHOP+'/datenschutz/'} target="_blank" rel="noopener noreferrer">${t.privacy}</a><a href=${SHOP+'/agb/'} target="_blank" rel="noopener noreferrer">${t.terms}</a></p>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
