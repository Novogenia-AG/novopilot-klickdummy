<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovoPilot – Partnerportal (GEN(e)IUS-Design v1)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#00163C;--bg1:#000712;--plum:#00225E;--berry:#1D468C;--lime:#C6D63F;--lime-d:#9DB01B;--lime-ink:#000E26;
  --ink:#241F2C;--soft:#675E6E;--line:rgba(0,34,94,.12);--wash:#F1F3F7;
  --ok:#5FA81E;--warn:#FFB81C;--bad:#D32F2F;--info:#3B82C4;
  --r:24px;--f:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;--num:'Archivo Black','Montserrat',sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}html{background:#000712}
body{font-family:var(--f);color:#fff;min-height:100vh;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 700px at 70% -10%,#0A275A 0%,transparent 60%),linear-gradient(180deg,var(--bg0),var(--bg1));background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px;border-radius:12px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:128px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 0;z-index:30;
  background:linear-gradient(180deg,rgba(0,22,60,.72),rgba(0,10,26,.72));backdrop-filter:blur(18px) saturate(1.4);border-right:1px solid rgba(255,255,255,.1);overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.brand{font-weight:800;font-size:31px;letter-spacing:.01em;text-align:center;margin:6px 0 16px;line-height:1}.brand b{display:block}
.brand b{color:var(--lime)}
.nav{width:108px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;border-radius:18px;font-size:12.5px;font-weight:700;text-align:center;color:rgba(255,255,255,.86);transition:all .18s var(--ease)}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:var(--lime);color:var(--lime-ink);box-shadow:0 10px 24px -10px rgba(198,214,63,.6)}
.nav .ext{font-size:9px;opacity:.7}.nav .ic{width:24px;height:24px}
.rail .sep{width:48px;height:1px;background:rgba(255,255,255,.14);margin:6px 0}
.rail .grow{flex:1}
.main{padding:20px 28px 80px;max-width:1240px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.8)}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:800;font-size:12px}
.pill-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:700}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:28px;padding:26px 28px 24px;background:var(--plum);border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 48px -32px rgba(0,0,0,.65);margin-bottom:26px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--lime)}
.hero h1{font-size:44px;line-height:1.05;margin:8px 0 8px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:0 0 14px;color:rgba(255,255,255,.82);max-width:720px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.st{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.88);color:var(--ink)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.y{background:#FFB81C;color:#3a2600}.st.g{background:#6FBF2A;color:#0c2400}.st.b{background:#BFD9F2;color:#0b2a4a}.st.p{background:#D6DEEB;color:var(--plum)}.st.r{background:#F4C7C7;color:#6b0b0b}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:800;font-size:14px;transition:all .18s var(--ease)}
.btn.lime{background:var(--lime);color:var(--lime-ink);box-shadow:0 12px 26px -12px rgba(198,214,63,.7)}
.btn.lime:hover{transform:translateY(-1px)}
.btn.ghost{border:1px solid rgba(255,255,255,.3);color:#fff}
.btn.line{border:1px solid var(--line);color:var(--plum);background:#fff}
.btn.sm{padding:8px 14px;font-size:13px}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- sections & cards ---------- */
.sec{display:flex;align-items:center;gap:10px;margin:26px 0 4px}
.sec h2{margin:0;font-size:14px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.count{background:var(--lime);color:var(--lime-ink);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:800}
.sub{color:rgba(255,255,255,.72);font-size:14px;margin:0 0 12px}
.card{background:#fff;color:var(--ink);border-radius:var(--r);padding:20px;box-shadow:0 22px 44px -22px rgba(0,3,8,.7),0 2px 8px rgba(0,3,8,.14)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.stat>div{min-width:0}.kpi .lbl{overflow-wrap:anywhere;hyphens:auto}
.paybtn{margin-top:10px;background:var(--lime-ink);color:var(--lime);padding:8px 14px;font-size:13px}
.bigsec{margin:34px 0 4px}.bigsec h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em;color:#fff}.bigsec+.sub{margin-bottom:14px}
.sup{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.chatwin{display:flex;flex-direction:column;height:560px;padding:0;overflow:hidden}
.chathd{display:flex;gap:12px;align-items:center;padding:16px 20px;background:var(--wash);border-bottom:1px solid var(--line)}
.chathd .sic{width:44px;height:44px;border-radius:14px;background:var(--plum);color:var(--lime);display:grid;place-items:center}
.chatlog{flex:1;overflow-y:auto;scrollbar-width:none;padding:18px 20px;display:flex;flex-direction:column;gap:10px}.chatlog::-webkit-scrollbar{display:none}
.msg{max-width:80%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.45}
.msg.bot{background:var(--wash);color:var(--ink);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--plum);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.chatq{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 10px}
.chatin{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.chatin input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font:inherit}
.field textarea{border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);font:inherit;font-weight:500;min-height:120px;resize:vertical}
@media (max-width:980px){.sup{grid-template-columns:1fr}}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.kpi .lbl{font-size:12px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}
.kpi .val{font-family:var(--num);font-size:30px;color:var(--plum);margin-top:6px}
.kpi .trend{font-size:12px;color:var(--ok);font-weight:700}
.kpi.hl{background:var(--lime);color:var(--lime-ink)}.kpi.hl .val{color:var(--lime-ink)}.kpi.hl .lbl{color:rgba(0,14,38,.7)}

/* swipe row (no visible scrollbar) */
.swipe{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 10px;margin:0 -2px}
.swipe::-webkit-scrollbar{display:none}
.swipe>*{scroll-snap-align:start;flex:0 0 auto}
.tile{text-align:left;width:150px;background:#fff;color:var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;box-shadow:0 14px 30px -18px rgba(0,3,8,.7)}
.tile .bubble{width:42px;height:42px;border-radius:14px;background:var(--wash);display:grid;place-items:center;color:var(--plum)}
.tile b{font-size:14px}.tile span{font-size:12px;color:var(--soft)}
.tile.on{outline:3px solid var(--lime)}

/* list rows */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:#fff;color:var(--ink);border-radius:18px;padding:14px 18px;box-shadow:0 10px 24px -18px rgba(0,3,8,.7);cursor:pointer;transition:transform .15s var(--ease)}
.row:hover{transform:translateY(-1px)}
.row .t{font-weight:800}.row .s{font-size:13px;color:var(--soft)}
.row .r{text-align:right}
.ccard .row{transition:border-radius .2s}
.ccard.open .row{border-radius:18px 18px 6px 6px;outline:2px solid var(--lime)}
.cright{display:flex;align-items:center;gap:10px}
.obadge{display:inline-flex;align-items:center;gap:7px;background:var(--wash);color:var(--plum);border-radius:14px;padding:7px 12px;font-size:12px;font-weight:700}
.obadge b{font-family:var(--num);font-size:18px;font-weight:400}
.info{position:relative;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--soft);font-style:italic}
.info .tip{position:absolute;right:0;top:32px;width:230px;background:var(--ink);color:#fff;font-style:normal;font-weight:500;font-size:12px;line-height:1.6;padding:10px 12px;border-radius:12px;opacity:0;pointer-events:none;transform:translateY(-4px);transition:.15s;z-index:5;text-align:left}
.info:hover .tip,.info:focus .tip{opacity:1;transform:none}
.chevw{width:38px;height:38px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 14px -6px rgba(0,34,94,.7);transition:background .2s}
.chevw .ic{width:22px;height:22px;stroke-width:3;transition:transform .25s var(--ease)}
.ccard.open .chevw,.ccard.sel .chevw{background:var(--lime);color:var(--lime-ink)}.ccard.sel .row{outline:2px solid var(--lime)}
.ccard.open .chevw .ic{transform:rotate(90deg)}
.ccard>.row:hover .chevw{transform:scale(1.06)}
.lastord{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:12px;font-weight:700;color:var(--berry)}
.lastord .ic{width:14px;height:14px}
.sublist{margin:16px 0 22px 22px;padding:4px 0 4px 18px;border-left:2px solid rgba(198,214,63,.6);display:flex;flex-direction:column;gap:12px}
.ocard{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;color:var(--ink);border-radius:14px;padding:12px 16px;cursor:pointer;box-shadow:0 8px 18px -14px rgba(0,3,8,.7)}
.ocard .t{font-weight:800;font-size:14px}.ocard .s{font-size:12px;color:var(--soft)}.ocard .r{text-align:right}
.sublist .btn{align-self:flex-start}
/* Gendaten je Kunde (wie GEN(e)IUS): Download Rohdaten / Upload Fremddaten */
.gbox{background:#F3F6FB;border:1px solid rgba(0,34,94,.14);border-radius:16px;padding:16px;color:var(--ink);display:flex;flex-direction:column;gap:12px;min-width:0}
.ghead{display:flex;gap:12px;align-items:center}.ghead>div{flex:1;min-width:0}.ghead .s{color:var(--soft);font-size:13px}
.ghead .gic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--plum);color:#fff}
.glbl{font-weight:800;font-size:13px}
.gfmt,.gacts,.gsrc{display:flex;flex-wrap:wrap;gap:8px}.gbox .btn{align-self:auto}
.gok{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;cursor:pointer}
.gnote{margin:0;font-size:12px;color:var(--soft);display:flex;gap:6px;align-items:flex-start}.gnote .ic{flex:none;width:14px;height:14px;margin-top:1px}
.gdrop{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:20px;background:#fff}.gdrop.on{border-color:var(--lime);background:#f8fbe6}.gdrop b{color:var(--ink)}.gdrop span{font-size:12px}
.gbar{height:6px;border-radius:9px;background:#dde4ee;overflow:hidden}.gbar i{display:block;height:100%;width:40%;background:var(--lime);animation:gbar 1.2s ease-in-out infinite}
@keyframes gbar{0%{margin-left:-40%}100%{margin-left:100%}}
.gbox .btn[disabled]{opacity:.45;pointer-events:none}
.lastord.gtag{color:#3d7a12;display:flex;margin-top:2px}
.lead{display:flex;align-items:center;gap:12px;min-width:0}
.lic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
/* Kunde = zartes Plum, Bestellung = zartes Lime */
.ccard>.row,.crow{background:#F3F6FB;border:1px solid rgba(0,34,94,.14)}
.ccard>.row .lic,.crow .lic{background:var(--plum);color:#fff}
.orow{background:#F7F9E6;border:1px solid rgba(157,176,27,.28)}
.orow .lic{background:var(--lime);color:var(--lime-ink)}
.ccard .obadge{background:#fff}
.ocard{background:#F7F9E6;border:1px solid rgba(157,176,27,.28)}
.ocard .lic{width:36px;height:36px;border-radius:12px;background:var(--lime);color:var(--lime-ink)}
.row>div:first-child,.ocard>div:first-child{min-width:0}
.row .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.obadge span{display:none}.sublist{margin-left:8px;padding-left:10px}.cright{gap:6px}}
.money{font-family:var(--num);color:var(--plum)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--soft);word-break:break-all}
.ometa{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:6px}
.ocust{display:flex;align-items:center;gap:5px;margin-top:2px;font-size:12px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocust .ic{width:13px;height:13px}
.rows>.ocard{padding:16px 18px;border-radius:18px}

/* Kennzahl-Kacheln mit Icon (Bestellung = Lime-Ton, Kunde = Plum-Ton) */
.stat{display:flex;gap:14px;align-items:center}
.stat .sic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--wash);color:var(--berry)}
.stat .sic .ic{width:26px;height:26px;stroke-width:2}
.stat .val{margin-top:2px;font-size:26px}
.stat.o{background:#F7F9E6}.stat.o .sic{background:var(--lime);color:var(--lime-ink)}
.stat.c{background:#F3F6FB}.stat.c .sic{background:var(--plum);color:#fff}
.stat.hl .sic{background:var(--lime-ink);color:var(--lime)}
/* Netzwerk */
.netviz{position:relative;border-radius:28px;padding:10px;margin-bottom:6px;overflow:hidden;cursor:grab;user-select:none;
  background:radial-gradient(rgba(255,255,255,.13) 1.2px,transparent 1.3px) 0 0/22px 22px,radial-gradient(700px 360px at 50% 40%,#1B4A9C 0%,#123A80 45%,#0D2D66 100%);
  border:1.5px solid rgba(198,214,63,.45);box-shadow:0 24px 50px -24px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.15)}
.netviz:active{cursor:grabbing}
.nvn{cursor:pointer}.nvn:hover circle{stroke:#fff;stroke-width:4}
.nvctl{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px;z-index:2}
.nvctl button{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.92);color:#00225E;display:grid;place-items:center;box-shadow:0 6px 16px -8px rgba(0,0,0,.6)}
.nvctl button:hover{background:var(--lime)}
.nvtip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;background:#fff;color:var(--ink);font-size:12.5px;line-height:1.45;padding:10px 12px;border-radius:12px;box-shadow:0 14px 30px -10px rgba(0,0,0,.6);max-width:260px;z-index:3}
.nvtip b{color:var(--plum)}
.netviz svg{display:block;width:100%;height:auto}
.netviz .lgd{position:absolute;left:20px;top:18px;display:flex;gap:14px;font-size:12px;color:rgba(255,255,255,.7)}
.netviz .lgd i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.atile{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.atile .sic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--plum);color:#fff}
.atile .sic .ic{width:32px;height:32px;stroke-width:1.9}
.atile b{font-size:16px}.atile p{margin:0;font-size:13px;color:var(--soft);flex:1}
.atile .btn{margin-top:4px}
.ocard.comm .money{font-size:18px}
/* Kundenportal-Button */
.pbtn{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:14px;background:var(--plum);color:#fff;font-size:12px;font-weight:700;transition:transform .15s}
.pbtn:hover{transform:translateY(-1px)}
.pbtn .pic{position:relative;width:28px;height:28px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.pbtn .pic .ic{width:18px;height:18px}
.pbtn.locked{background:#E6E9ED;color:#8a7f88}
.pbtn.locked .pic{background:#fff}
.plock{position:absolute;right:-6px;bottom:-6px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;border:2px solid #F3F6FB}
.plock .ic{width:10px!important;height:10px!important;stroke-width:2.6}
@media (max-width:980px){.pbtn .pl{display:none}.pbtn{padding:6px}}
/* Produktauswahl */
.psec{display:flex;align-items:center;gap:12px;margin:22px 0 12px}
.psec:first-child{margin-top:4px}
.psec b{font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink)}.psec .s{font-size:12px;color:var(--soft)}
.psic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--tint);color:var(--acc)}
.pcard{position:relative;display:flex;flex-direction:column;border-radius:18px;background:#fff;
  border:2px solid transparent;overflow:hidden;cursor:pointer;
  transition:border-color .15s,transform .15s;box-shadow:0 10px 24px -20px rgba(0,8,24,.7)}
.pcard:hover{transform:translateY(-1px)}
.pcard .phd{position:relative;padding:16px 64px 15px 16px;background:var(--tint)}
.ptb{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;
  font-size:11px;font-weight:800;letter-spacing:.04em;background:#fff;color:var(--acc)}
.ptb::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pn{display:block;margin-top:10px;font-size:17px;font-weight:800;line-height:1.28;
  letter-spacing:-.01em;color:var(--ink)}
.pbrand{margin-top:5px;font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--acc);opacity:.85}
.pdesc{margin:8px 0 0;font-size:12.5px;color:var(--soft);line-height:1.55}
.pcard .pbd{flex:1;padding:14px 16px 15px}
.pcard .pbd h5{margin:0 0 10px;font-size:10px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--plum)}
.pinc{list-style:none;margin:0;padding:0}
.pinc li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:12.5px;
  line-height:1.45;font-weight:500;color:var(--ink)}
.pbu{flex:none;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.pbu .ic{width:12.5px;height:12.5px;stroke-width:2.1}
.pbu.b{background:#DCEBFA;color:#1F5A93}.pbu.v{background:#E9E1F8;color:#5A3AA6}
.pbu.g{background:#D9F0C6;color:#2B6E12}.pbu.a{background:#FFE9B8;color:#8A5D00}
.pbu.i{background:#D7EEF0;color:#17666E}.pbu.r{background:#FBDDE6;color:#A3204D}
.pcard .pft{padding:10px 16px 11px;background:var(--wash);border-top:1px solid var(--line);
  font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:var(--soft);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchk{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:2.5px solid rgba(0,0,0,.18);background:#fff;display:grid;place-items:center;color:transparent;transition:.15s}
.pchk .ic{width:21px;height:21px;stroke-width:3.4}
.pcard.on{border-color:#3E9B1F;box-shadow:0 0 0 4px rgba(111,191,42,.25)}

function drawer(html){const d=document.getElementById('drawer');d.innerHTML=`<button class="btn line sm" onclick="closeDrawer()" style="margin-bottom:14px">${ic('back')} Schließen</button>`+html;document.body.classList.add('open')}

function renderRail(cur){
  document.getElementById('rail').innerHTML=`<div class="brand">NOVO<b>PILOT</b></div>`+NAV.map(n=>{
    if(n===null)return '<div class="sep"></div>';if(n==='grow')return '<div class="grow"></div>';
    const [id,l,i,href]=n;if(href)return `<a class="nav" data-r="${id}" href="${href}" target="${href==='#'?'_self':'_blank'}" rel="noopener">${ic(i)}<span>${l}</span>${href!=='#'?'<span class="ext">↗</span>':''}</a>`;
    return `<a class="nav ${cur===id?'on':''}" data-r="${id}" href="#${id}">${ic(i)}<span>${l}</span></a>`}).join('');
  // Handy: aktiven Reiter sichtbar halten, Ränder je nach Scrollposition ausblenden
  const r=document.getElementById('rail'),on=r.querySelector('.nav.on');
  if(innerWidth<=640&&on&&(on.offsetLeft<r.scrollLeft||on.offsetLeft+on.offsetWidth>r.scrollLeft+r.clientWidth))r.scrollLeft=on.offsetLeft-(r.clientWidth-on.offsetWidth)/2;
  r.onscroll=railFade;railFade();
}
function railFade(){const r=document.getElementById('rail'),m=r.scrollWidth-r.clientWidth;r.classList.toggle('l',r.scrollLeft>4);r.classList.toggle('r',r.scrollLeft<m-4)}

const daysAgo=d=>Math.round((NOW-parseD(d))/864e5);

 {k:'name',t:'text',l:'Name',ph:'Vor- oder Nachname'},
 {k:'email',t:'text',l:'E-Mail-Adresse',ph:'z. B. @novogenia.com'},
 {k:'barcode',t:'text',l:'Barcode',ph:'Probenbarcode'},

 {k:'days',t:'days',l:'Letzte Bestellung'},

const O_DEFS=[
 {k:'name',t:'text',l:'Kunde',ph:'Vor- oder Nachname'},
 {k:'email',t:'text',l:'E-Mail-Adresse',ph:'z. B. @novogenia.com'},
 {k:'barcode',t:'text',l:'Barcode',ph:'Probenbarcode'},
 {k:'probe',t:'select',l:'Proben',opts:PROBE_OPTS},
 {k:'status',t:'select',l:'Status',opts:Object.keys(ST).filter(s=>ORDERS.some(o=>o.status===s)).map(s=>[s,ST[s][1]])},
 {k:'prod',t:'select',l:'Produkt',opts:[...new Set(ORDERS.map(o=>o.prod))].sort().map(p=>[p,p])},

function oMatch(o,f){
  if(f.q&&!lc(o.no+' '+o.cust+' '+o.prod+' '+o.barcode).includes(lc(f.q)))return false;
  if(f.name&&!lc(o.cust).includes(lc(f.name)))return false;
  if(f.email&&!lc(o.email).includes(lc(f.email)))return false;
  if(f.barcode&&!lc(o.barcode).includes(lc(f.barcode)))return false;
  if(f.probe&&probeOf(o)!==f.probe)return false;
  if(f.status&&o.status!==f.status)return false;
  if(f.prod&&o.prod!==f.prod)return false;
  return daysOk(o.date,f)&&inRange(o.date,f)}
function cMatch(c,f){const os=custOrders(c);
  if(f.q&&!lc(c.name+' '+c.email).includes(lc(f.q))&&!os.some(o=>lc(o.barcode).includes(lc(f.q))))return false;
  if(f.name&&!lc(c.name).includes(lc(f.name)))return false;
  if(f.email&&!lc(c.email).includes(lc(f.email)))return false;
  if(f.barcode&&!os.some(o=>lc(o.barcode).includes(lc(f.barcode))))return false;
  if(f.probe&&!os.some(o=>probeOf(o)===f.probe))return false;
  if(f.min!==''&&c.orders<+f.min)return false;
  if(f.max!==''&&c.orders>+f.max)return false;
  if((f.from||f.to)&&!os.some(o=>inRange(o.date,f)))return false;
  return daysOk(c.last,f)}

// aktive Filter als entfernbare Chips: [Text, Reset-Code]
function fActive(F,N,defs){const out=[];defs.forEach(d=>{
  if(d.t==='text'&&F[d.k])out.push([`${d.l}: „${F[d.k]}“`,`${N}.${d.k}=''`]);
  if(d.t==='select'&&F[d.k])out.push([`${d.l}: ${d.opts.find(o=>o[0]===F[d.k])[1]}`,`${N}.${d.k}=''`]);
  if(d.t==='days'&&F.days!=='')out.push([`${d.l} ${F.dMode==='in'?'in den letzten':'vor mehr als'} ${F.days} Tagen`,`${N}.days=''`]);
  if(d.t==='range'&&(F.from||F.to))out.push([`${d.l} ${F.from?isoDe(F.from):'…'} – ${F.to?isoDe(F.to):'…'}`,`${N}.from='';${N}.to=''`]);
  if(d.t==='num'&&(F.min!==''||F.max!==''))out.push([`${d.l}: ${F.min!==''?F.min:'0'}–${F.max!==''?F.max:'∞'}`,`${N}.min='';${N}.max=''`]);
});return out}
function fCtl(F,N,d){const id=`f-${N}-${d.k}`,set=k=>`${N}.${k}=this.value;render(true)`;
  if(d.t==='text')return `<label class="field">${d.l}<input id="${id}" placeholder="${d.ph}" value="${esc(F[d.k])}" oninput="${set(d.k)}"></label>`;
  if(d.t==='select')return `<label class="field">${d.l}<select onchange="${set(d.k)}"><option value="">Alle</option>${d.opts.map(([v,l])=>`<option value="${esc(v)}" ${F[d.k]===v?'selected':''}>${l}</option>`).join('')}</select></label>`;
  if(d.t==='days')return `<div class="field">${d.l}<div class="frange"><select onchange="${set('dMode')}"><option value="in" ${F.dMode==='in'?'selected':''}>in den letzten …</option><option value="out" ${F.dMode==='out'?'selected':''}>vor mehr als …</option></select><input id="${id}" type="number" min="0" placeholder="X Tage" value="${F.days}" oninput="${set('days')}"></div>
     <div class="fquick">${[7,30,90,180].map(n=>`<button class="qchip ${F.days==n&&F.days!==''?'on':''}" onclick="${N}.days=${F.days==n&&F.days!==''?"''":`'${n}'`};render(true)">${n} Tage</button>`).join('')}</div></div>`;
  if(d.t==='range')return `<div class="field">${d.l}<div class="frange"><input type="date" title="von" value="${F.from}" onchange="${set('from')}"><input type="date" title="bis" value="${F.to}" onchange="${set('to')}"></div></div>`;
  if(d.t==='num')return `<div class="field">${d.l}<div class="frange"><input id="${id}-min" type="number" min="0" placeholder="mind." value="${F.min}" oninput="${set('min')}"><input id="${id}-max" type="number" min="0" placeholder="höchstens" value="${F.max}" oninput="${set('max')}"></div></div>`}
function fBar(F,N,defs,ph,hits,total,unit){const act=fActive(F,N,defs);
  return `<div class="tools"><label class="search">${ic('search')}<input id="f-${N}-q" placeholder="${ph}" value="${esc(F.q)}" oninput="${N}.q=this.value;render(true)"></label>
     <button class="btn fbtn ${F.open?'on':''}" onclick="${N}.open=!${N}.open;render(true)">${ic('filter')} Filter${act.length?` <span class="count">${act.length}</span>`:''}</button></div>
   ${F.open?`<div class="card fpanel"><div class="fgrid">${defs.map(d=>fCtl(F,N,d)).join('')}</div>
     <div class="ffoot"><span><b style="color:var(--plum)">${hits}</b> von ${total} ${unit}</span><span style="display:flex;gap:8px">${act.length?`<button class="btn line sm" onclick="Object.assign(${N},${N}0,{open:true});render(true)">Zurücksetzen</button>`:''}<button class="btn lime sm" onclick="${N}.open=false;render(true)">Fertig</button></span></div></div>`:''}
   ${act.length?`<div class="achips">${act.map(([t,r])=>`<span class="achip">${t}<button title="Filter entfernen" onclick="${r};render(true)">×</button></span>`).join('')}<span class="achip reset" onclick="Object.assign(${N},${N}0,{open:${N}.open});render(true)">Alle Filter löschen</span></div>`:''}`}

function commCard(c){const o=ORDERS.find(x=>x.no===c.no)||{no:c.no,prod:'Bestellung',cust:'—',date:c.date,status:''};

// Gendaten je Kunde – gleiche Funktionen wie in GEN(e)IUS: Rohdaten aus dem Novogenia-Labor herunterladen (TXT/CSV/VCF)
// oder vorhandene Rohdaten eines anderen DNA-Tests hochladen (23andMe, AncestryDNA …) → Analysen ohne neue Probe
const NON_DNA=['Monthly Subscription Payment','NovoDailies'];
const GFMT=[['txt','TXT (23andMe-Format)'],['csv','CSV'],['vcf','VCF']];
const GSRC=['Novogenia','23andMe','AncestryDNA','MyHeritage','FamilyTreeDNA','Living DNA'];
let GENE_UP={},gFmt='txt',gOk={},gDrawer=null;
function geneOf(c){if(GENE_UP[c.email])return GENE_UP[c.email];
  const o=custOrders(c).filter(o=>o.status==='Completed'&&!NON_DNA.includes(o.prod)).sort((a,b)=>parseD(a.date)-parseD(b.date))[0];
  return o?{src:'Novogenia-Labor',date:o.date,snps:'≈ 700.000',state:'ready',lab:true}:null}
function geneRefresh(e){if(gDrawer===e&&document.body.classList.contains('open'))custDrawer(e);else render(true)}
function geneBox(c){const g=geneOf(c),e=c.email,ok=gOk[e],fn=c.name.split(' ')[0],busy=g&&g.state==='processing';
  const head=`<div class="ghead"><span class="gic">${ic('dna')}</span><div><b>Gendaten</b><div class="s">${!g?'Noch keine Gendaten vorhanden':busy?`${g.file} wird geprüft …`:g.lab?`${g.src} · ${g.snps} Marker · Analyse abgeschlossen ${ago(g.date)}`:`${g.src} · ${g.snps} Marker · hochgeladen ${ago(g.date)}`}</div></div>${g?`<span class="st ${busy?'y':'g'}">${busy?'Wird geprüft':'Vorhanden'}</span>`:''}</div>`;
  if(busy)return `<div class="gbox">${head}<div class="gbar"><i></i></div></div>`;
  if(g)return `<div class="gbox">${head}
    <div class="glbl">Rohdaten herunterladen</div>
    <div class="gfmt">${GFMT.map(([k,l])=>`<button class="btn ${gFmt===k?'lime':'line'} sm" onclick="gFmt='${k}';geneRefresh('${e}')">${l}</button>`).join('')}</div>
    <label class="gok"><input type="checkbox" ${ok?'checked':''} onchange="gOk['${e}']=this.checked;geneRefresh('${e}')"> ${fn} hat dem Download zugestimmt</label>
    <div class="gacts"><button class="btn lime sm" ${ok?'':'disabled'} onclick="geneDl('${e}')">${ic('dl')} Herunterladen</button>
      ${g.lab?'':`<button class="btn line sm" onclick="geneDel('${e}')">Datei entfernen</button>`}
      <a class="btn line sm" href="#neu" onclick="wPick=${CUSTOMERS.indexOf(c)};wStep=1;wCust='existing';closeDrawer()">${ic('plus')} Analyse ohne neue Probe</a></div>
    <p class="gnote">${ic('shield')} Genetische Daten sind besonders geschützt (Art. 9 DSGVO). Download nur mit Zustimmung von ${fn} – jeder Download wird protokolliert.</p></div>`;
  return `<div class="gbox">${head}
    <div class="drop gdrop" onclick="this.nextElementSibling.click()" ondragover="event.preventDefault();this.classList.add('on')" ondragleave="this.classList.remove('on')" ondrop="event.preventDefault();geneUp('${e}',event.dataTransfer.files[0])">${ic('up')}<b>Gendaten hochladen</b><span>Datei hierher ziehen oder antippen · .txt, .csv, .vcf, .zip</span></div>
    <input type="file" accept=".txt,.csv,.vcf,.zip,.gz" hidden onchange="geneUp('${e}',this.files[0])">
    <div class="gsrc">${GSRC.map(s=>`<span class="st p">${s}</span>`).join('')}</div>
    <p class="gnote">${ic('dna')} ${fn} hat schon einen DNA-Test gemacht? Lade die Rohdaten hoch – viele Analysen gibt es dann ohne neue Probe. Nur mit Zustimmung von ${fn}.</p></div>`}
function geneUp(e,f){if(!f)return;if(!/\.(txt|csv|vcf|zip|gz)$/i.test(f.name)){toast('Dateiformat nicht unterstützt – bitte .txt, .csv, .vcf oder .zip');return}
  const n=f.name.toLowerCase(),src=/23andme/.test(n)?'23andMe':/ancestry/.test(n)?'AncestryDNA':/myheritage/.test(n)?'MyHeritage':/ftdna|familytree/.test(n)?'FamilyTreeDNA':/living/.test(n)?'Living DNA':'Rohdaten-Upload';
  GENE_UP[e]={src,file:f.name,date:'30/10/2026 12:00',snps:'≈ 640.000',state:'processing'};geneRefresh(e);
  setTimeout(()=>{GENE_UP[e].state='ready';geneRefresh(e);toast(`Gendaten geprüft und gespeichert (${src})`)},1800)}
function geneDel(e){delete GENE_UP[e];gOk[e]=false;geneRefresh(e);toast('Hochgeladene Datei entfernt')}
function geneDl(e){const c=CUSTOMERS.find(x=>x.email===e),g=geneOf(c);
  const rows=[['rs4477212','1','82154','AA'],['rs3094315','1','752566','AG'],['rs1801133','1','11856378','CT'],['rs4988235','2','135851076','AG'],['rs429358','19','44908684','TT'],['rs7412','19','44908822','CC']];
  let t;if(gFmt==='vcf')t='##fileformat=VCFv4.2\n##source=NovoPilot (Demo-Auszug)\n#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\tFORMAT\tSAMPLE\n'+rows.map(r=>`${r[1]}\t${r[2]}\t${r[0]}\t${r[3][0]}\t${r[3][1]===r[3][0]?'.':r[3][1]}\t.\tPASS\t.\tGT\t${r[3][1]===r[3][0]?'0/0':'0/1'}`).join('\n');
  else{const s=gFmt==='csv'?',':'\t';t=`# Rohdaten (Demo-Auszug) · Quelle: ${g.src}\n`+['rsid','chromosome','position','genotype'].join(s)+'\n'+rows.map(r=>r.join(s)).join('\n')}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=`gendaten-kunde-${CUSTOMERS.indexOf(c)+1}.${gFmt}`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Rohdaten heruntergeladen (Demo-Auszug) – Download protokolliert')}

  const mv=ev=>{if(Math.abs(ev.clientX-px)+Math.abs(ev.clientY-py)>3)nvMoved=true;nvX+=(ev.clientX-px)*k;nvY+=(ev.clientY-py)*k;px=ev.clientX;py=ev.clientY;nvApply()},up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};

// QR-Vorschau (Muster aus dem Link abgeleitet; der echte Code kommt vom System)
function qrSvg(txt,size){let seed=[...txt].reduce((s,c)=>(s*31+c.charCodeAt(0))%233280,7),r=()=>(seed=(seed*9301+49297)%233280)/233280,cells='';
  for(let y=0;y<25;y++)for(let x=0;x<25;x++){const f=(x<7&&y<7)||(x>17&&y<7)||(x<7&&y>17);const on=f?((x%6===0||y%6===0||(x>1&&x<5&&y>1&&y<5)||(x>19&&x<23&&y>1&&y<5)||(x>1&&x<5&&y>19&&y<23)||x===24||y===24)&&!(x>17&&y>17)):r()>.55;if(on)cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  return `<svg viewBox="-1 -1 27 27" width="${size}" height="${size}" fill="#000E26" role="img" aria-label="QR-Code">${cells}</svg>`}

 ['shop','','Dein Shop','Bevor dein Shop sich öffnet, erklärt dir diese Seite, wie er funktioniert. Hier teilst du deinen Shop-Link, lädst den QR-Code herunter und öffnest den Shop.'],
 ['customers','','Deine Kunden','Hier findest du alle Kundinnen und Kunden, die über dich bestellt haben. Mit Suche und Filtern (Name, E-Mail, Barcode, Probenstatus, Zeitraum, Anzahl Bestellungen) findest du jeden sofort. Ein Klick auf eine Kundenkarte klappt die Gendaten und alle Bestellungen darunter auf: Rohdaten herunterladen oder die Rohdaten eines anderen DNA-Tests hochladen.'],
 ['customers','.pbtn:not(.locked)','Kundenportal öffnen','Mit diesem Button steigst du direkt in das Kundenportal deines Kunden ein und siehst dort seine Berichte, Bestellungen und Ergebnisse – so kannst du ihn optimal beraten. Das geht nur, wenn diese Funktion für dich aktiviert wurde. Ist sie nicht aktiviert, ist der Button grau und mit einem Schloss gesperrt.'],
 ['orders','','Bestellungen','Alle Bestellungen deiner Kunden mit Status, Probenstatus und Barcode. Filtere nach Produkt, Status, Zeitraum oder Kunde – die Karten zeigen dir auf einen Blick, wann bestellt wurde und wo die Probe gerade steht.'],
 ['neu','','Neue Bestellung','In fünf Schritten bestellst du für einen bestehenden oder neuen Kunden: Kunde wählen, Produkt wählen, Fragen beantworten, Adresse eingeben, prüfen. Viele Bestellungen auf einmal lädst du per Sammel-Upload hoch.'],
 ['finances','','Deine Direktverkaufsprovision','Für jedes Produkt, das du selbst an deine Kunden verkaufst – über deinen Shop oder über „Neue Bestellung“ –, erhältst du eine Direktverkaufsprovision. Hier siehst du Bestellungen, Einnahmen, Kunden und den Verlauf deiner Provisionen; jede Provision erscheint als Karte mit ihrem Status.'],
 ['finances','.paybtn','Auszahlung beantragen','Freigegebene Provisionen werden als „auszahlbar“ angezeigt. Mit „Auszahlung beantragen“ forderst du die Auszahlung auf dein in den Firmendaten hinterlegtes Bankkonto an. Jede Zeile in der Liste zeigt die Herleitung: Produkt, Kunde, Bestellwert netto, Provision in %, deine Provision und Status mit Datum.'],

let tourI=-1,tourHi=null;
const tourEl=()=>{const [r,sel]=TOUR[tourI];return sel?document.querySelector('.main '+sel)||document.querySelector(sel):document.querySelector(`.rail .nav[data-r="${r}"]`)};
function tourPlace(){const t=tourEl(),tip=document.getElementById('tourTip');if(!t)return;const b=t.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  if(innerWidth-b.right>w+30){let y=Math.max(12,Math.min(innerHeight-h-12,b.top+b.height/2-34));tip.className='tour-tip on left';tip.style.left=(b.right+16)+'px';tip.style.top=y+'px';tip.style.setProperty('--ay',(b.top+b.height/2-y-8)+'px')}
  else{let x=Math.max(12,Math.min(innerWidth-w-12,b.left+b.width/2-w/2));const below=b.bottom+h+24<innerHeight;tip.className='tour-tip on '+(below?'down':'up');tip.style.left=x+'px';tip.style.top=(below?b.bottom+14:b.top-h-14)+'px';tip.style.setProperty('--ax',(b.left+b.width/2-x-8)+'px')}}
function tourShow(n){tourI=Math.max(0,Math.min(TOUR.length-1,n));const [r,sel,t,p]=TOUR[tourI];
  if(tourHi)tourHi.classList.remove('tour-hi');
  if(!r.startsWith('x:')&&location.hash!=='#'+r){location.hash='#'+r;render()}
  setTimeout(()=>{const el=tourEl();tourHi=el;if(el){el.classList.add('tour-hi');if(sel){const r=el.getBoundingClientRect();window.scrollTo(0,Math.max(0,r.top+scrollY-innerHeight/2+r.height/2-120))}else window.scrollTo(0,0)}
    const tip=document.getElementById('tourTip');
    document.getElementById('tourN').textContent=tourI+1;document.getElementById('tourOf').textContent='von '+TOUR.length;
    document.getElementById('tourT').textContent=t;document.getElementById('tourP').textContent=p;
    document.getElementById('tourDots').innerHTML=TOUR.map((_,k)=>`<b class="${k===tourI?'on':''}"></b>`).join('');
    document.getElementById('tourBack').disabled=tourI===0;document.getElementById('tourNext').textContent=tourI===TOUR.length-1?'Fertig':'Weiter';
    tip.hidden=false;tourPlace()},180)}
function tourStart(){document.body.classList.add('touring');tourShow(0)}
function tourEnd(){document.body.classList.remove('touring');if(tourHi)tourHi.classList.remove('tour-hi');const tip=document.getElementById('tourTip');tip.classList.remove('on');setTimeout(()=>tip.hidden=true,250);tourI=-1}
function tourGo(d){if(d>0&&tourI===TOUR.length-1){tourEnd();toast('Tutorial beendet – du kannst es oben jederzeit neu starten.')}else tourShow(tourI+d)}
addEventListener('keydown',e=>{if(tourI<0)return;if(e.key==='Escape')tourEnd();else if(e.key==='ArrowRight')tourGo(1);else if(e.key==='ArrowLeft')tourGo(-1)});
addEventListener('resize',()=>{if(tourI>=0)tourPlace()});
addEventListener('scroll',()=>{if(tourI>=0)tourPlace()},true);

function render(keepFocus){let id=location.hash.slice(1)||'home';if(id.startsWith('partner-')){pSel=id.slice(8);id='partner'}const page=P[id]?id:'home';renderRail(page==='partner'?'network':page);
  const a=document.activeElement,isIn=keepFocus&&a&&a.tagName==='INPUT',pos=isIn?a.selectionStart:0,ph=isIn?a.placeholder:null,aid=isIn?a.id:'';
  document.getElementById('main').innerHTML=`<div class="top"><div class="who"><span class="avatar">CN</span>${PARTNER.company}</div><div style="display:flex;gap:8px"><button class="pill-btn tourbtn" onclick="tourStart()">${ic('star')} Tutorial</button><a class="pill-btn" href="#academy">${ic('cap')} Academy</a></div></div>`+P[page]()+`<p class="note">Entwurf v1 · Inhalte aus stage.novopilot.com (Stand 30.10.2026)${['network','partner','home'].includes(page)?' · Netzwerk-Details, Provisionssätze und Partner-Bestellungen sind Beispieldaten':''} · Darstellung nach GEN(e)IUS-App-Logik · Demo ohne Backend.</p>`;
  if(isIn){const n=(aid&&document.getElementById(aid))||[...document.querySelectorAll('input')].find(i=>i.placeholder===ph);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
  if(!keepFocus)window.scrollTo(0,0)}
addEventListener('hashchange',()=>{closeDrawer();render()});render();
</script>

  <div class="tour-k"><i id="tourN">1</i><span id="tourOf">von 13</span></div>
  <h3 id="tourT"></h3><p id="tourP"></p>
  <div class="tour-f"><span class="tour-dots" id="tourDots"></span><button class="btn line sm" id="tourBack" onclick="tourGo(-1)">Zurück</button><button class="btn lime sm" id="tourNext" onclick="tourGo(1)">Weiter</button></div>
