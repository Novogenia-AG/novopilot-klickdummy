<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovoPilot – Partnerportal (GEN(e)IUS-Design v1)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#00163C;--bg1:#000712;--plum:#00225E;--berry:#1D468C;--lime:#C6D63F;--lime-d:#9DB01B;--lime-ink:#000E26;
  --ink:#241F2C;--soft:#675E6E;--line:rgba(0,34,94,.12);--wash:#F1F3F7;
  --ok:#5FA81E;--warn:#FFB81C;--bad:#D32F2F;--info:#3B82C4;
  --r:24px;--f:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;--num:'Archivo Black','Montserrat',sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}html{background:#000712}
body{font-family:var(--f);color:#fff;min-height:100vh;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 700px at 70% -10%,#0A275A 0%,transparent 60%),linear-gradient(180deg,var(--bg0),var(--bg1));background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px;border-radius:12px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:128px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 0;z-index:30;
  background:linear-gradient(180deg,rgba(0,22,60,.72),rgba(0,10,26,.72));backdrop-filter:blur(18px) saturate(1.4);border-right:1px solid rgba(255,255,255,.1);overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.brand{font-weight:800;font-size:31px;letter-spacing:.01em;text-align:center;margin:6px 0 16px;line-height:1}.brand b{display:block}
.brand b{color:var(--lime)}
.nav{width:108px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;border-radius:18px;font-size:12.5px;font-weight:700;text-align:center;color:rgba(255,255,255,.86);transition:all .18s var(--ease)}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:var(--lime);color:var(--lime-ink);box-shadow:0 10px 24px -10px rgba(198,214,63,.6)}
.nav .ext{font-size:9px;opacity:.7}.nav .ic{width:24px;height:24px}
.rail .sep{width:48px;height:1px;background:rgba(255,255,255,.14);margin:6px 0}
.rail .grow{flex:1}
.main{padding:20px 28px 80px;max-width:1240px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.8)}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:800;font-size:12px}
.pill-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:700}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:28px;padding:26px 28px 24px;background:var(--plum);border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 48px -32px rgba(0,0,0,.65);margin-bottom:26px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--lime)}
.hero h1{font-size:44px;line-height:1.05;margin:8px 0 8px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:0 0 14px;color:rgba(255,255,255,.82);max-width:720px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.st{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.88);color:var(--ink)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.y{background:#FFB81C;color:#3a2600}.st.g{background:#6FBF2A;color:#0c2400}.st.b{background:#BFD9F2;color:#0b2a4a}.st.p{background:#D6DEEB;color:var(--plum)}.st.r{background:#F4C7C7;color:#6b0b0b}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:800;font-size:14px;transition:all .18s var(--ease)}
.btn.lime{background:var(--lime);color:var(--lime-ink);box-shadow:0 12px 26px -12px rgba(198,214,63,.7)}
.btn.lime:hover{transform:translateY(-1px)}
.btn.ghost{border:1px solid rgba(255,255,255,.3);color:#fff}
.btn.line{border:1px solid var(--line);color:var(--plum);background:#fff}
.btn.sm{padding:8px 14px;font-size:13px}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- sections & cards ---------- */
.sec{display:flex;align-items:center;gap:10px;margin:26px 0 4px}
.sec h2{margin:0;font-size:14px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.count{background:var(--lime);color:var(--lime-ink);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:800}
.sub{color:rgba(255,255,255,.72);font-size:14px;margin:0 0 12px}
.card{background:#fff;color:var(--ink);border-radius:var(--r);padding:20px;box-shadow:0 22px 44px -22px rgba(0,3,8,.7),0 2px 8px rgba(0,3,8,.14)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.stat>div{min-width:0}.kpi .lbl{overflow-wrap:anywhere;hyphens:auto}
.paybtn{margin-top:10px;background:var(--lime-ink);color:var(--lime);padding:8px 14px;font-size:13px}
.bigsec{margin:34px 0 4px}.bigsec h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em;color:#fff}.bigsec+.sub{margin-bottom:14px}
.sup{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.chatwin{display:flex;flex-direction:column;height:560px;padding:0;overflow:hidden}
.chathd{display:flex;gap:12px;align-items:center;padding:16px 20px;background:var(--wash);border-bottom:1px solid var(--line)}
.chathd .sic{width:44px;height:44px;border-radius:14px;background:var(--plum);color:var(--lime);display:grid;place-items:center}
.chatlog{flex:1;overflow-y:auto;scrollbar-width:none;padding:18px 20px;display:flex;flex-direction:column;gap:10px}.chatlog::-webkit-scrollbar{display:none}
.msg{max-width:80%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.45}
.msg.bot{background:var(--wash);color:var(--ink);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--plum);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.chatq{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 10px}
.chatin{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.chatin input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font:inherit}
.field textarea{border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);font:inherit;font-weight:500;min-height:120px;resize:vertical}
@media (max-width:980px){.sup{grid-template-columns:1fr}}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.kpi .lbl{font-size:12px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}
.kpi .val{font-family:var(--num);font-size:30px;color:var(--plum);margin-top:6px}
.kpi .trend{font-size:12px;color:var(--ok);font-weight:700}
.kpi.hl{background:var(--lime);color:var(--lime-ink)}.kpi.hl .val{color:var(--lime-ink)}.kpi.hl .lbl{color:rgba(0,14,38,.7)}

/* swipe row (no visible scrollbar) */
.swipe{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 10px;margin:0 -2px}
.swipe::-webkit-scrollbar{display:none}
.swipe>*{scroll-snap-align:start;flex:0 0 auto}
.tile{text-align:left;width:150px;background:#fff;color:var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;box-shadow:0 14px 30px -18px rgba(0,3,8,.7)}
.tile .bubble{width:42px;height:42px;border-radius:14px;background:var(--wash);display:grid;place-items:center;color:var(--plum)}
.tile b{font-size:14px}.tile span{font-size:12px;color:var(--soft)}
.tile.on{outline:3px solid var(--lime)}

/* list rows */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:#fff;color:var(--ink);border-radius:18px;padding:14px 18px;box-shadow:0 10px 24px -18px rgba(0,3,8,.7);cursor:pointer;transition:transform .15s var(--ease)}
.row:hover{transform:translateY(-1px)}
.row .t{font-weight:800}.row .s{font-size:13px;color:var(--soft)}
.row .r{text-align:right}
.ccard .row{transition:border-radius .2s}
.ccard.open .row{border-radius:18px 18px 6px 6px;outline:2px solid var(--lime)}
.cright{display:flex;align-items:center;gap:10px}
.obadge{display:inline-flex;align-items:center;gap:7px;background:var(--wash);color:var(--plum);border-radius:14px;padding:7px 12px;font-size:12px;font-weight:700}
.obadge b{font-family:var(--num);font-size:18px;font-weight:400}
.info{position:relative;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--soft);font-style:italic}
.info .tip{position:absolute;right:0;top:32px;width:230px;background:var(--ink);color:#fff;font-style:normal;font-weight:500;font-size:12px;line-height:1.6;padding:10px 12px;border-radius:12px;opacity:0;pointer-events:none;transform:translateY(-4px);transition:.15s;z-index:5;text-align:left}
.info:hover .tip,.info:focus .tip{opacity:1;transform:none}
.chevw{width:38px;height:38px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 14px -6px rgba(0,34,94,.7);transition:background .2s}
.chevw .ic{width:22px;height:22px;stroke-width:3;transition:transform .25s var(--ease)}
.ccard.open .chevw,.ccard.sel .chevw{background:var(--lime);color:var(--lime-ink)}.ccard.sel .row{outline:2px solid var(--lime)}
.ccard.open .chevw .ic{transform:rotate(90deg)}
.ccard>.row:hover .chevw{transform:scale(1.06)}
.lastord{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:12px;font-weight:700;color:var(--berry)}
.lastord .ic{width:14px;height:14px}
.sublist{margin:16px 0 22px 22px;padding:4px 0 4px 18px;border-left:2px solid rgba(198,214,63,.6);display:flex;flex-direction:column;gap:12px}
.ocard{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;color:var(--ink);border-radius:14px;padding:12px 16px;cursor:pointer;box-shadow:0 8px 18px -14px rgba(0,3,8,.7)}
.ocard .t{font-weight:800;font-size:14px}.ocard .s{font-size:12px;color:var(--soft)}.ocard .r{text-align:right}
.sublist .btn{align-self:flex-start}
/* Online-Beratung */
.swipe>.cal{flex:1 0 760px}
.cal{background:#fff;color:var(--ink);border-radius:20px;padding:12px 12px 14px;box-shadow:0 22px 44px -22px rgba(0,3,8,.7)}
.calhd,.calbd{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:0 4px}
.calhd div{font-size:12px;font-weight:800;text-align:center;padding:4px 0 8px;color:var(--soft)}.calhd .today{color:var(--plum)}
.caltimes div{height:var(--px);font-size:11px;color:var(--soft);text-align:right;padding-right:6px;transform:translateY(-7px)}
.calday{position:relative;height:calc(var(--px)*12);background:repeating-linear-gradient(180deg,#E4E8F0 0 1px,transparent 1px var(--px));border-radius:10px;cursor:crosshair;user-select:none;-webkit-user-select:none}
.calday.past{background-color:#F6F7FA;cursor:not-allowed}
.cslot{position:absolute;left:3px;right:3px;border-radius:8px;border:1.5px dashed #5FA81E;background:repeating-linear-gradient(135deg,rgba(95,168,30,.18) 0 6px,rgba(95,168,30,.06) 6px 12px);font-size:10.5px;font-weight:700;color:#2f5f0a;padding:3px 5px;overflow:hidden;cursor:pointer}
.cbook{position:absolute;left:7px;right:7px;border-radius:8px;background:var(--plum);color:#fff;font-size:10.5px;font-weight:700;padding:3px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;z-index:2;box-shadow:0 4px 10px -4px rgba(0,0,0,.5)}
.cbook.live{background:var(--lime);color:var(--lime-ink)}.cbook.done{background:#8a93a3}
.cghost{position:absolute;left:3px;right:3px;border:2px dashed var(--plum);background:rgba(59,130,196,.15);border-radius:8px;font-size:11px;font-weight:800;color:var(--plum);padding:3px 5px;pointer-events:none;z-index:3}
.cnow{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:4;pointer-events:none}
.calbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}.calbar .wk{font-weight:800;font-size:15px;margin:0 4px}
.tsel{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-left:auto}.tsel select{border-radius:999px;border:0;padding:8px 12px;color:var(--ink);background:#fff;font-weight:700}
.lgd2{display:flex;gap:8px 16px;font-size:12.5px;color:rgba(255,255,255,.82);flex-wrap:wrap;margin:6px 0 10px;align-items:center}.lgd2 i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.lgd2 .lf{background:rgba(95,168,30,.45);border:1px dashed #9be15a}.lgd2 .lb{background:#00225E;border:1px solid rgba(255,255,255,.5)}.lgd2 .ll{background:var(--lime)}.lgd2 b{color:var(--lime)}
.bkrow{grid-template-columns:minmax(0,1fr) auto}.bkl{display:flex;gap:14px;align-items:center;min-width:0}
.bkd{width:54px;height:58px;flex:none;border-radius:14px;background:var(--wash);color:var(--plum);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800;line-height:1.1}.bkd b{font-family:var(--num);font-size:22px;font-weight:400}
.bkr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.inv{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.inv span{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;background:#E3F2D2;color:#3d7a12;border-radius:8px;padding:2px 7px}.inv .ic{width:12px;height:12px}
.mut{color:var(--soft);font-size:13px;margin:0 0 10px}
.advc{display:flex;gap:12px;align-items:center;margin-top:10px}.advc small{display:block;color:var(--soft);font-size:12.5px}.avatar.big{width:52px;height:52px;background:var(--plum);color:#fff;font-size:16px;flex:none}
.advprice{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:#F7F9E6;border-radius:14px;padding:12px 14px}.advprice b{font-size:18px;color:var(--plum)}.advprice span:not(.st){font-size:13px;font-weight:700;color:var(--soft)}
.lockc{display:flex;gap:14px;align-items:flex-start}.lki{width:44px;height:44px;border-radius:14px;background:var(--wash);color:var(--plum);display:grid;place-items:center;flex:none}
.rhd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 14px}.rhd h2{margin:4px 0 2px;font-size:28px}.rhd span:not(.st){font-size:13px;color:rgba(255,255,255,.75)}
.room{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}.rmain{min-width:0}
.rside{display:flex;flex-direction:column;gap:14px}
.rtabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.rtab{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px;background:var(--wash);color:var(--plum)}.rtab .ic{width:17px;height:17px}
.rtab.on{background:var(--plum);color:#fff}.rtab.ptr{margin-left:auto;border:1.5px dashed var(--plum);background:#fff}.rtab.ptr.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.rstage{position:relative;min-height:420px}.rin{position:relative}.ptrmode .rin,.ptrmode .pg{cursor:crosshair}
.rhb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rchip{padding:6px 12px;border-radius:999px;background:var(--wash);color:var(--plum);font-weight:700;font-size:12.5px}.rchip.on{background:var(--plum);color:#fff}
.spread{display:grid;grid-template-columns:1fr 1fr;background:#CFD6E2;padding:14px;border-radius:16px;margin:10px auto 0;max-width:calc(96vh - 60px)}
.pg{position:relative;background:#fff;aspect-ratio:210/297;padding:9% 9%;box-shadow:0 6px 18px -8px rgba(0,0,0,.35);font-size:clamp(7px,.9vw,11px);overflow:hidden;color:var(--ink)}
.pg.l{border-radius:6px 0 0 6px;box-shadow:inset -10px 0 14px -12px rgba(0,0,0,.35),0 6px 18px -8px rgba(0,0,0,.35)}.pg.r{border-radius:0 6px 6px 0;box-shadow:inset 10px 0 14px -12px rgba(0,0,0,.35),0 6px 18px -8px rgba(0,0,0,.35)}
.pg.blank{background:transparent;box-shadow:none}.pg.img{padding:0}.pg.img img{width:100%;height:100%;object-fit:cover;display:block}
.pg .pe{font-size:.8em;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--berry)}
.pg h3{font-size:2em;margin:.4em 0;color:var(--plum);line-height:1.1}.pg .res{background:var(--wash);border-radius:8px;padding:.8em;margin:.8em 0;font-weight:700}
.pg .ln,.rhtml .ln{height:.55em;background:#E4E8F0;border-radius:4px;margin:.6em 0}.rhtml .ln{height:8px}
.pg .pno{position:absolute;bottom:4%;left:0;right:0;text-align:center;font-size:.85em;color:var(--soft)}
.pg.cover{background:linear-gradient(160deg,#00225E,#1D468C);color:#fff;display:flex;flex-direction:column;justify-content:center}.pg.cover h3{color:#fff;font-size:2.6em}.pg.cover .pno{color:rgba(255,255,255,.6)}
.rhl{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid var(--lime);background:rgba(198,214,63,.28);box-shadow:0 0 0 6px rgba(198,214,63,.3);pointer-events:none;animation:hlp 1.4s infinite;z-index:5}
@keyframes hlp{50%{box-shadow:0 0 0 14px rgba(198,214,63,0)}}@media (prefers-reduced-motion:reduce){.rhl{animation:none}}
.pgnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 0}.pgnav b{color:var(--plum);font-size:13.5px;text-align:center}.pgnav .btn[disabled],.rst .btn[disabled]{opacity:.4;pointer-events:none}
.rhtml{position:relative;height:460px;overflow-y:auto;scrollbar-width:none;border:1px solid var(--line);border-radius:16px;padding:4px 20px;margin-top:10px}.rhtml::-webkit-scrollbar{display:none}
.rhtml section{padding:16px 0;border-bottom:1px solid var(--line)}.rhtml h4{margin:0 0 8px;font-size:18px;color:var(--plum)}.rhtml section.cur h4{color:var(--berry)}.rhtml p{font-size:14px;margin:10px 0 6px}
.dose{color:var(--plum);text-align:right}
.clamp2{display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.mrow{cursor:pointer;border-radius:12px;transition:background .15s}.mrow:hover{background:var(--wash)}.mrow.mon{background:var(--wash);box-shadow:inset 0 0 0 2px var(--lime)}
.boffer{display:flex;align-items:center;gap:16px;padding:20px 22px;margin:0 0 20px;cursor:pointer;border:2px solid var(--lime)}.boffer:not(.on){animation:bpulse 2.2s ease-in-out infinite}@keyframes bpulse{50%{box-shadow:0 0 0 7px rgba(198,214,63,.35)}}.boffer.on{background:#F3F8E1}.boffer:focus-visible{outline:3px solid var(--lime);outline-offset:3px}

.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--soft)}
.chart span.b{width:100%;max-width:44px;border-radius:10px 10px 4px 4px;background:var(--plum)}
.chart span.b.l{background:var(--lime)}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--wash);border-radius:14px;padding:10px 12px;font-size:13px}
.linkbox code{flex:1;word-break:break-all}
.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(198,214,63,.7);z-index:40}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#fff;color:var(--ink);padding:12px 18px;border-radius:999px;font-weight:700;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);transition:.25s var(--ease);z-index:80}
.toast.on{transform:translateX(-50%)}
.note{font-size:12px;color:rgba(255,255,255,.55);margin-top:30px}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}.hero h1{font-size:34px}}
@media (max-width:640px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px;overflow-x:auto;border-right:0;border-top:1px solid rgba(255,255,255,.1)}
  .brand,.rail .sep,.rail .grow{display:none}.nav{width:68px;flex:none}
  .main{padding:14px 16px 110px}.g4{grid-template-columns:1fr 1fr}.hero h1{font-size:28px}.fab{bottom:86px}
  .kv{grid-template-columns:1fr}
  /* Handy: nichts darf breiter als der Bildschirm werden */
  html,body{overflow-x:clip}
  .app{grid-template-columns:minmax(0,1fr)}.main{min-width:0}
  .main *{min-width:0}
  .top .who{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .pill-btn{padding:7px 10px;font-size:12px}
  .hero{padding:20px 18px 18px;border-radius:22px}.hero p{font-size:14px}
  .hero .acts .btn{flex:1 1 100%;justify-content:center}
  .nav{width:72px;font-size:10px;padding:6px 2px;gap:3px}.nav .ic{width:22px;height:22px}.nav .ext{display:none}
  .row{grid-template-columns:minmax(0,1fr);gap:10px;padding:14px}
  .cright{justify-content:flex-start;flex-wrap:wrap}.cright .chevw{margin-left:auto;width:34px;height:34px}
  .ocard{grid-template-columns:minmax(0,1fr)}.ocard .r{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding-left:48px}.ocard .r .ometa{display:flex;align-items:center;gap:8px}
  .g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g3,.g2{grid-template-columns:minmax(0,1fr)}
  .stat{flex-direction:column;align-items:flex-start;gap:10px}.stat .sic{width:42px;height:42px}.kpi .val{font-size:24px}
  .bigsec h2{font-size:24px}
  .pgrid{grid-template-columns:minmax(0,1fr)}.pcard .phd{padding:14px 56px 13px 14px}.pn{font-size:16px}
  .chatwin{height:480px}.msg{max-width:90%}
  .steps{overflow-x:auto;scrollbar-width:none}.steps::-webkit-scrollbar{display:none}
  .netviz{border-radius:20px;padding:4px}.netviz .lgd{left:12px;top:10px;flex-wrap:wrap;gap:6px 10px;font-size:10.5px;max-width:70%}.netviz .lgd span:last-child{display:none}.nvctl{right:10px;top:auto;bottom:10px;flex-direction:row}.nvctl button{width:32px;height:32px}
  .tour-tip{width:calc(100vw - 24px)}
  .top .who{flex:1;gap:8px;display:flex;align-items:center}.top .avatar{flex:none}.top a.pill-btn{display:none}
  /* 4 gleich große Kacheln in 2 Zeilen; Auszahlungs-Button passt sich der Kachel an */
  .g4{grid-auto-rows:1fr}.g4 .stat>div{width:100%}.g4 .kpi .lbl{overflow-wrap:normal}.kpi .lbl{font-size:10.5px}.kpi .val{font-size:21px}
  .paybtn{width:100%;justify-content:center;padding:8px 6px;font-size:11.5px;line-height:1.2;white-space:normal;text-align:center}.paybtn .ic{display:none}
  /* Navigation unten: wischbar, ausgeblendete Ränder zeigen, dass es weitergeht */
  .rail{scroll-snap-type:x proximity}.rail .nav{scroll-snap-align:start}
  .rail.r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent)}
  .rail.l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 56px);mask-image:linear-gradient(90deg,transparent,#000 56px)}
  .rail.l.r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 56px,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(90deg,transparent,#000 56px,#000 calc(100% - 56px),transparent)}
  .pfchips{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;margin-right:-20px;padding-right:20px}.pfchips::-webkit-scrollbar{display:none}.pfchips>*{flex:none;scroll-snap-align:start}
}
/* Startseite: Shop mit QR-Code */
.shopcard{display:flex;gap:22px;align-items:center;flex-wrap:wrap;color:var(--ink)}.qrbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;flex:none;line-height:0}
.shopinfo{flex:1;min-width:220px}.shopacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.shopinfo .hint{color:var(--soft);font-size:13px;margin:10px 0 0}
/* Summenband: Direkt + Netzwerk = Gesamt = eine Auszahlung */
.payband{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;background:var(--lime);color:var(--lime-ink);border-radius:24px;padding:20px 24px;margin:18px 0 6px;box-shadow:0 20px 40px -24px rgba(0,0,0,.7)}
.pbsum{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}.pbsum span{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.72}
.pbsum b{font-size:22px;font-weight:800}.pbsum .tot b{font-size:30px}.pbsum i{font-style:normal;font-size:24px;font-weight:800;opacity:.55}
.pbact{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.pbact small{font-size:12px;opacity:.8}.payband .paybtn{margin-top:0;padding:10px 16px;font-size:14px}
/* Provisionszeile: Herleitung */
.calc{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:7px;font-size:12px;color:var(--soft)}
.calc span{background:rgba(0,34,94,.07);border-radius:8px;padding:2px 7px;font-weight:700;color:var(--ink)}.calc i{font-style:normal;font-weight:800}
.calc b{font-size:13px;color:var(--lime-ink);background:var(--lime);border-radius:8px;padding:2px 8px}
.sdate{font-size:11.5px;color:var(--soft);margin-top:4px;line-height:1.35}
/* Netzwerk: Partner, Datenschutz */
.demo{font-size:10px;font-weight:800;background:#FFE9A8;color:#6B4E00;border-radius:6px;padding:2px 6px;vertical-align:middle;margin-left:4px}
.privacy{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:14px 16px;margin:18px 0 4px;font-size:13.5px;line-height:1.5}
.privacy .ic{flex:none;color:var(--lime);width:22px;height:22px}
.backlink{margin-bottom:12px}.nvn.click{cursor:pointer}
@media (max-width:640px){
  .shopcard{flex-direction:column;align-items:stretch}.qrbox{align-self:center}.shopacts .btn{flex:1 1 100%;justify-content:center}
  .payband{padding:16px}.pbsum b{font-size:18px}.pbsum .tot{flex-basis:100%}.pbsum .tot b{font-size:26px}.pbact{width:100%}.payband .paybtn{width:100%}
  .ocard .r .sdate{margin-top:0;text-align:right}
}
</style>

const NOW=new Date('2026-10-30T12:00');
const daysAgo=d=>Math.round((NOW-parseD(d))/864e5);
const PROBE={wait:['Probe ausstehend',['Order Received','Kit Shipped']],lab:['Probe im Labor',['Sample Received','Lab Analysis','Report Generation']],done:['Bericht fertig',['Completed']]};
const probeOf=o=>Object.keys(PROBE).find(k=>PROBE[k][1].includes(o.status))||'wait';
// Stage-Liste zeigt keine Probenbarcodes – Demo-Werte, sobald ein Kit zugeordnet ist
ORDERS.forEach((o,i)=>{o.barcode=o.status==='Order Received'?'':'NG'+String(40117 + i*3613).padStart(8,'0')});
const lc=s=>(s||'').toLowerCase();
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const inRange=(d,f)=>!(f.from&&parseD(d)<new Date(f.from+'T00:00'))&&!(f.to&&parseD(d)>new Date(f.to+'T23:59'));
const daysOk=(d,f)=>f.days===''||(f.dMode==='in'?daysAgo(d)<=+f.days:daysAgo(d)>+f.days);
const isoDe=s=>s.split('-').reverse().join('.');

const cF={open:false,q:'',name:'',email:'',probe:'',barcode:'',dMode:'in',days:'',from:'',to:'',min:'',max:''},cF0={...cF};
const oF={open:false,q:'',name:'',email:'',prod:'',status:'',probe:'',barcode:'',dMode:'in',days:'',from:'',to:''},oF0={...oF};
const PROBE_OPTS=Object.entries(PROBE).map(([k,v])=>[k,v[0]]);
const C_DEFS=[
 {k:'name',t:'text',l:'Name',ph:'Vor- oder Nachname'},
 {k:'email',t:'text',l:'E-Mail-Adresse',ph:'z. B. @novogenia.com'},
 {k:'barcode',t:'text',l:'Barcode',ph:'Probenbarcode'},
 {k:'probe',t:'select',l:'Proben',opts:PROBE_OPTS},
 {k:'days',t:'days',l:'Letzte Bestellung'},
 {k:'from',t:'range',l:'Bestellungen zwischen'},
 {k:'min',t:'num',l:'Anzahl Bestellungen'}];
const O_DEFS=[
 {k:'name',t:'text',l:'Kunde',ph:'Vor- oder Nachname'},
 {k:'email',t:'text',l:'E-Mail-Adresse',ph:'z. B. @novogenia.com'},
 {k:'barcode',t:'text',l:'Barcode',ph:'Probenbarcode'},
 {k:'probe',t:'select',l:'Proben',opts:PROBE_OPTS},
 {k:'status',t:'select',l:'Status',opts:Object.keys(ST).filter(s=>ORDERS.some(o=>o.status===s)).map(s=>[s,ST[s][1]])},
 {k:'prod',t:'select',l:'Produkt',opts:[...new Set(ORDERS.map(o=>o.prod))].sort().map(p=>[p,p])},
 {k:'days',t:'days',l:'Bestellt'},
 {k:'from',t:'range',l:'Bestellt zwischen'}];

function oMatch(o,f){
  if(f.q&&!lc(o.no+' '+o.cust+' '+o.prod+' '+o.barcode).includes(lc(f.q)))return false;
  if(f.name&&!lc(o.cust).includes(lc(f.name)))return false;
  if(f.email&&!lc(o.email).includes(lc(f.email)))return false;
  if(f.barcode&&!lc(o.barcode).includes(lc(f.barcode)))return false;
  if(f.probe&&probeOf(o)!==f.probe)return false;
  if(f.status&&o.status!==f.status)return false;
  if(f.prod&&o.prod!==f.prod)return false;
  return daysOk(o.date,f)&&inRange(o.date,f)}
function cMatch(c,f){const os=custOrders(c);
  if(f.q&&!lc(c.name+' '+c.email).includes(lc(f.q))&&!os.some(o=>lc(o.barcode).includes(lc(f.q))))return false;
  if(f.name&&!lc(c.name).includes(lc(f.name)))return false;
  if(f.email&&!lc(c.email).includes(lc(f.email)))return false;
  if(f.barcode&&!os.some(o=>lc(o.barcode).includes(lc(f.barcode))))return false;
  if(f.probe&&!os.some(o=>probeOf(o)===f.probe))return false;
  if(f.min!==''&&c.orders<+f.min)return false;
  if(f.max!==''&&c.orders>+f.max)return false;
  if((f.from||f.to)&&!os.some(o=>inRange(o.date,f)))return false;
  return daysOk(c.last,f)}

// aktive Filter als entfernbare Chips: [Text, Reset-Code]
function fActive(F,N,defs){const out=[];defs.forEach(d=>{
  if(d.t==='text'&&F[d.k])out.push([`${d.l}: „${F[d.k]}“`,`${N}.${d.k}=''`]);
  if(d.t==='select'&&F[d.k])out.push([`${d.l}: ${d.opts.find(o=>o[0]===F[d.k])[1]}`,`${N}.${d.k}=''`]);
  if(d.t==='days'&&F.days!=='')out.push([`${d.l} ${F.dMode==='in'?'in den letzten':'vor mehr als'} ${F.days} Tagen`,`${N}.days=''`]);
  if(d.t==='range'&&(F.from||F.to))out.push([`${d.l} ${F.from?isoDe(F.from):'…'} – ${F.to?isoDe(F.to):'…'}`,`${N}.from='';${N}.to=''`]);
  if(d.t==='num'&&(F.min!==''||F.max!==''))out.push([`${d.l}: ${F.min!==''?F.min:'0'}–${F.max!==''?F.max:'∞'}`,`${N}.min='';${N}.max=''`]);
});return out}
function fCtl(F,N,d){const id=`f-${N}-${d.k}`,set=k=>`${N}.${k}=this.value;render(true)`;
  if(d.t==='text')return `<label class="field">${d.l}<input id="${id}" placeholder="${d.ph}" value="${esc(F[d.k])}" oninput="${set(d.k)}"></label>`;
  if(d.t==='select')return `<label class="field">${d.l}<select onchange="${set(d.k)}"><option value="">Alle</option>${d.opts.map(([v,l])=>`<option value="${esc(v)}" ${F[d.k]===v?'selected':''}>${l}</option>`).join('')}</select></label>`;
  if(d.t==='days')return `<div class="field">${d.l}<div class="frange"><select onchange="${set('dMode')}"><option value="in" ${F.dMode==='in'?'selected':''}>in den letzten …</option><option value="out" ${F.dMode==='out'?'selected':''}>vor mehr als …</option></select><input id="${id}" type="number" min="0" placeholder="X Tage" value="${F.days}" oninput="${set('days')}"></div>
     <div class="fquick">${[7,30,90,180].map(n=>`<button class="qchip ${F.days==n&&F.days!==''?'on':''}" onclick="${N}.days=${F.days==n&&F.days!==''?"''":`'${n}'`};render(true)">${n} Tage</button>`).join('')}</div></div>`;
  if(d.t==='range')return `<div class="field">${d.l}<div class="frange"><input type="date" title="von" value="${F.from}" onchange="${set('from')}"><input type="date" title="bis" value="${F.to}" onchange="${set('to')}"></div></div>`;
  if(d.t==='num')return `<div class="field">${d.l}<div class="frange"><input id="${id}-min" type="number" min="0" placeholder="mind." value="${F.min}" oninput="${set('min')}"><input id="${id}-max" type="number" min="0" placeholder="höchstens" value="${F.max}" oninput="${set('max')}"></div></div>`}
function fBar(F,N,defs,ph,hits,total,unit){const act=fActive(F,N,defs);
  return `<div class="tools"><label class="search">${ic('search')}<input id="f-${N}-q" placeholder="${ph}" value="${esc(F.q)}" oninput="${N}.q=this.value;render(true)"></label>
     <button class="btn fbtn ${F.open?'on':''}" onclick="${N}.open=!${N}.open;render(true)">${ic('filter')} Filter${act.length?` <span class="count">${act.length}</span>`:''}</button></div>
   ${F.open?`<div class="card fpanel"><div class="fgrid">${defs.map(d=>fCtl(F,N,d)).join('')}</div>
     <div class="ffoot"><span><b style="color:var(--plum)">${hits}</b> von ${total} ${unit}</span><span style="display:flex;gap:8px">${act.length?`<button class="btn line sm" onclick="Object.assign(${N},${N}0,{open:true});render(true)">Zurücksetzen</button>`:''}<button class="btn lime sm" onclick="${N}.open=false;render(true)">Fertig</button></span></div></div>`:''}
   ${act.length?`<div class="achips">${act.map(([t,r])=>`<span class="achip">${t}<button title="Filter entfernen" onclick="${r};render(true)">×</button></span>`).join('')}<span class="achip reset" onclick="Object.assign(${N},${N}0,{open:${N}.open});render(true)">Alle Filter löschen</span></div>`:''}`}

// Provision als Bestellkarte: gleiche Karte, rechts Provisionsbetrag + Provisionsstatus
function commCard(c){const o=ORDERS.find(x=>x.no===c.no)||{no:c.no,prod:'Bestellung',cust:'—',date:c.date,status:''};
  const net=c.pct&&c.amt?Math.round(c.amt/c.pct*1e4)/100:(o.price||0);
  return `<div class="ocard comm" onclick="ORDERS.find(x=>x.no==='${c.no}')&&orderDrawer('${c.no}')"><div class="lead"><span class="lic">${ic('box')}</span><div style="min-width:0"><div class="t">${o.prod}</div><div class="ocust">${ic('user')} ${o.cust}</div>${calcLine(net,c.pct,c.amt)}</div></div>
    <div class="r">${stDate(c)}</div></div>`}
// Herleitung: [Ebene] · Bestellwert netto × Provision in % = Provision
const calcLine=(net,pct,amt,lvl)=>`<div class="calc">${lvl?`<span>Ebene ${lvl}</span>`:''}<span>Netto ${eur(net)}</span><i>×</i><span>${pct.toLocaleString('de-AT')} %</span><i>=</i><b>${eur(amt)}</b></div>`;

/* Die Karte zeigt das Produkt so, wie der Endkunde es sieht: Marke, Name, kurzer Text
   und darunter die enthaltenen Leistungen untereinander. Code und technische
   Bezeichnung stehen nur im Fuss, fuer den Partner. */
function prodCard(p,i){const on=wProd.has(i);
  const feats=[...p[6]].sort((a,b)=>(FEAT[a][3]||150)-(FEAT[b][3]||150)||FEAT[a][0].localeCompare(FEAT[b][0],'de'));
  return `<div class="pcard ${p[5]} ${on?'on':''}" onclick="wProd.has(${i})?wProd.delete(${i}):wProd.add(${i});render(true)">
   <div class="phd"><span class="ptb">${PTYP[p[5]]||''}</span>
    <b class="pn">${p[4]}</b>
    ${p[7]?`<div class="pbrand">${p[7]}</div>`:''}
    ${p[8]?`<p class="pdesc">${p[8]}</p>`:''}
    <span class="pchk">${ic('check')}</span></div>
   <div class="pbd"><h5>Das ist enthalten</h5>
    <ul class="pinc">${feats.map(k=>`<li><span class="pbu ${FEAT[k][2]}">${ic(FEAT[k][1])}</span><span>${FEAT[k][0]}</span></li>`).join('')}</ul>
   </div>
   <div class="pft">${p[1]} &middot; ${p[0]}</div></div>`}
let wStep=1,wMode='single',wCust='existing',wPick=null,wProd=new Set(),wPF='all',wQ='',wSame=true;
P.neu=()=>{const S=['Kunde','Produkt','Fragen','Adresse','Prüfen'];const cu=wPick!=null?CUSTOMERS[wPick]:null;
  const prods=[...wProd].map(i=>PRODUCTS[i]);
  const body={1:()=>`<div class="seg"><button class="${wCust==='existing'?'on':''}" onclick="wCust='existing';render()">Bestehender Kunde</button><button class="${wCust==='new'?'on':''}" onclick="wCust='new';render()">Neuer Kunde</button></div>
     ${wCust==='existing'?(cu?`${custCard(cu,{sel:true})}<div style="margin:10px 0 4px"><button class="btn line sm" onclick="wPick=null;render()">Anderen Kunden wählen</button></div>
        <div class="grid g2" style="margin-top:12px"><label class="field">Anrede *<select><option>Herr</option><option>Frau</option><option>Divers</option></select></label><label class="field">Geschlecht *<select><option>Männlich</option><option>Weiblich</option><option>Divers</option></select></label></div><label class="field">Geburtsdatum *<input type="date" value="1963-11-22"></label>`
       :`<label class="search" style="border:1px solid var(--line);margin-bottom:12px">${ic('search')}<input placeholder="Kunden nach Name oder E-Mail suchen …"></label><div class="rows">${CUSTOMERS.map((c,i)=>custCard(c,{click:`wPick=${i};render()`})).join('')}</div>`)
       :`<div class="grid g2"><label class="field">Anrede *<select><option>Herr</option><option>Frau</option><option>Divers</option></select></label><label class="field">Geschlecht *<select><option>Männlich</option><option>Weiblich</option><option>Divers</option></select></label><label class="field">Vorname *<input></label><label class="field">Nachname *<input></label><label class="field">E-Mail *<input type="email"></label><label class="field">Geburtsdatum *<input type="date"></label></div>`}`,
   2:()=>`<p style="color:var(--soft);font-size:13px;margin-top:0">Der bestellbare Katalog deines Mandanten – wähle ein oder mehrere Produkte für diesen Kunden.</p>
     <div class="pfchips" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${[['all','Alle'],...PSEC.map(([k,t])=>[k,t])].map(([k,t])=>[k,`${t} · ${k==='all'?PRODUCTS.length:PRODUCTS.filter(p=>p[5]===k).length}`]).map(([k,v])=>`<button class="fchip" style="${wPF===k?'background:var(--plum);color:#fff':'background:var(--wash);color:var(--plum);border-color:transparent'}" onclick="wPF='${k}';render()">${v}</button>`).join('')}</div>
     <label class="search" style="border:1px solid var(--line);margin-bottom:12px">${ic('search')}<input placeholder="Nach Name, Code oder Typ suchen …" value="${wQ}" oninput="wQ=this.value;render(true)"></label>
     ${(()=>{const vis=PRODUCTS.map((p,i)=>[p,i]).filter(([p])=>(wPF==='all'||p[5]===wPF)&&(!wQ||(p[0]+p[1]+p[2]+p[4]+(p[7]||'')).toLowerCase().includes(wQ.toLowerCase())));
       return PSEC.filter(([k])=>wPF==='all'||k===wPF).map(([k,t,icn,sub])=>{const ps=vis.filter(([p])=>p[5]===k);return `<div class="psec ${k}"><span class="psic">${ic(icn)}</span><div><b>${t}</b> <span class="count">${ps.length}</span><div class="s">${sub}</div></div></div>`
         +(ps.length?`<div class="grid g2 pgrid">${ps.map(([p,i])=>prodCard(p,i)).join('')}</div>`:`<div class="empty" style="margin-bottom:8px">In deinem Katalog ist derzeit kein Produkt dieser Art freigeschaltet.</div>`)}).join('')})()}
     <p style="font-size:13px;font-weight:700;margin-bottom:0">${wProd.size?`Ausgewählt: ${wProd.size}`:'Noch kein Produkt ausgewählt.'}</p>`,
   3:()=>`<p style="color:var(--soft);font-size:13px;margin-top:0">Beantworte im Namen des Kunden. Pflichtfragen kommen aus den gewählten Produkten – ohne sie wird die Bestellung abgelehnt. Eine Frage, die mehrere Produkte teilen, wird nur einmal gestellt.</p>
     ${prods.length?`<div class="grid g3"><label class="field">Aktuelles Gewicht <span style="font-weight:500">(optional)</span><input type="number" placeholder="kg"></label><label class="field">Körpergröße <span style="font-weight:500">(optional)</span><input type="number" min="50" max="250" placeholder="cm (50–250)"></label><label class="field">Zielgewicht <span style="font-weight:500">(optional)</span><input type="number" placeholder="kg"></label></div>`:`<div class="empty">Bitte zuerst ein Produkt wählen.</div>`}`,
   4:()=>`<b>Rechnungsadresse</b><div class="grid g2" style="margin-top:10px"><label class="field">Vorname *<input value="${cu?cu.name.split(' ')[0]:''}"></label><label class="field">Nachname *<input value="${cu?cu.name.split(' ').slice(1).join(' '):''}"></label></div>
     <label class="field">Straße & Hausnummer *<input></label><div class="grid g2"><label class="field">PLZ *<input></label><label class="field">Ort *<input></label></div><label class="field">Land *<select><option>Österreich</option><option>Deutschland</option><option>Schweiz</option></select></label>
     <div class="toggle"><div><b>Lieferadresse</b><div style="color:var(--soft);font-size:13px">Wie Rechnungsadresse · Novogenia schickt das Probenset direkt an den Kunden.</div></div><button class="sw ${wSame?'on':''}" onclick="wSame=!wSame;render()"></button></div>
     ${wSame?'':`<div class="grid g2" style="margin-top:12px"><label class="field">Straße & Hausnummer *<input></label><label class="field">PLZ / Ort *<input></label></div>`}`,
   5:()=>`<div class="grid g2"><div class="card" style="box-shadow:none;border:1px solid var(--line)"><b>Kunde</b><dl class="kv"><dt>Kunde</dt><dd>${cu?cu.name:'Neuer Kunde'}</dd><dt>Typ</dt><dd>${wCust==='existing'?'Bestehender Kunde':'Neuer Kunde'}</dd><dt>E-Mail</dt><dd>${cu?cu.email:'—'}</dd><dt>Vertriebsmodell</dt><dd>Full Service</dd></dl></div>
     <div class="card" style="box-shadow:none;border:1px solid var(--line)"><b>Produkt & Adresse</b><dl class="kv"><dt>Produkt</dt><dd>${prods.map(p=>`${p[4]} (${p[1]})<div class="mono" style="font-weight:500">${p[0]}</div>`).join('')||'—'}</dd><dt>Lieferung</dt><dd>${wSame?'an Rechnungsadresse':'abweichende Lieferadresse'}</dd><dt>Berichtssprache</dt><dd>Deutsch</dd></dl></div></div>
     <div class="card" style="box-shadow:none;border:1px solid var(--line);margin-top:14px"><b>Preis</b><p style="color:var(--soft);font-size:13px">Richtwert: deine Preisliste gilt für deine Bestellungen noch nicht.</p>${prods.map(p=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)"><span>${p[1]} × 1</span><span style="color:var(--soft)">kein Preis</span></div>`).join('')}<div style="display:flex;justify-content:space-between;padding-top:10px;font-weight:800"><span>Gesamt inkl. MwSt.</span><span>—</span></div></div>`}[wStep]();
  return hero({eye:'Neue Bestellung',title:'Bestellung anlegen',text:'In fünf Schritten zur Bestellung – einzeln oder als Sammel-Upload.',
    acts:`<div class="seg" style="margin:0;background:rgba(255,255,255,.12)"><button class="${wMode==='single'?'on':''}" style="color:#fff" onclick="wMode='single';render()">Einzelbestellung</button><button class="${wMode==='bulk'?'on':''}" style="color:#fff" onclick="wMode='bulk';render()">Sammel-Upload</button></div>`})
  +(wMode==='bulk'?`<div class="steps"><span class="step on"><i>1</i>Hochladen</span><span class="bar"></span><span class="step"><i>2</i>Prüfen & ergänzen</span><span class="bar"></span><span class="step"><i>3</i>Bestellungen aufgeben</span></div>
     <div class="card"><p style="margin-top:0">Lade eine ausgefüllte Vorlage hoch, um viele Bestellungen auf einmal aufzugeben. Bestehende Kunden ordnen wir automatisch zu, den Rest bestätigst du.</p>
     <div class="pick" style="cursor:default"><div style="display:flex;gap:10px;align-items:center"><span class="bubble" style="width:38px;height:38px;border-radius:12px;background:var(--wash);display:grid;place-items:center;color:var(--plum)">${ic('csv')}</span><div><b>reseller-bulk-order-template.xlsx</b><div style="color:var(--soft);font-size:13px">Grundfelder, eine Spalte für den Produktcode und je eine Spalte pro Fragebogen-Frage aus deinem Katalog – bei jedem Download frisch erzeugt. Alle Fragen sind optional; leere Zellen sind immer in Ordnung.</div></div></div><button class="btn lime sm" onclick="toast('Vorlage wird heruntergeladen')">${ic('dl')} Vorlage</button></div>
     <div class="drop" style="margin-top:12px">${ic('dl')}<br><b>Ausgefüllte Vorlage hier ablegen</b><br>oder klicken zum Auswählen – nur .xlsx</div>
     <p style="color:var(--soft);font-size:13px;margin-bottom:0">Jede Zeile ist eine Bestellung. Die Spalte „Existing? (yes/no)“ legt fest, ob ein bestehender Kunde zugeordnet oder ein Gastkunde angelegt wird. Zugeordnet wird über Vorname + Nachname + Geburtsdatum innerhalb deines Mandanten.</p></div>`:
   `<div class="steps">${S.map((s,i)=>`${i?'<span class="bar"></span>':''}<span class="step ${i+1===wStep?'on':i+1<wStep?'done':''}"><i>${i+1<wStep?'✓':i+1}</i>${s}</span>`).join('')}</div>
   <div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><b>${S[wStep-1]}</b><span style="color:var(--soft);font-size:13px">Schritt ${wStep} von 5</span></div>${body}
   <div style="display:flex;justify-content:space-between;margin-top:16px"><button class="btn line sm" ${wStep===1?'disabled style="opacity:.4"':''} onclick="wStep--;render()">${ic('back')} Zurück</button><button class="btn lime sm" onclick="wStep<5?(wStep++,render()):toast('Bestellung abgeschickt (Demo)')">${wStep<5?'Weiter':'Bestellung aufgeben'} ${ic('chev')}</button></div></div>`)};

P.finances=()=>{const months=[['Mai',0],['Jun',0],['Jul',0],['Aug',124.36],['Sep',0],['Okt',34.5]];const mx=Math.max(...months.map(m=>m[1]))||1;
  return hero({eye:'Finanzen',title:'Deine Provisionen',text:'Deine Provisionen aus selbst verkauften Produkten – verdient, ausstehend und ausbezahlt. Hier beantragst du deine Auszahlung.',
     chips:`<span class="st g">Auszahlbar · ${eur(available)}</span><span class="st y">Ausstehend · ${eur(pending)}</span>`,
     acts:`<button class="btn ghost" onclick="toast('Export Direktverkaufsprovisionen')">${ic('csv')} Direktverkaufsprovisionen exportieren</button>`})
  +bigsec('Deine Direktverkaufsprovisionen','Provisionen aus Produkten, die du selbst verkauft hast.')+directStats()
  +sec('Überblick',null,'Provisionen der letzten sechs Monate (Demo-Werte aus den Provisionsdaten).')
  +`<div class="card"><div class="chart">${months.map((m,i)=>`<div><span style="font-weight:700;color:var(--ink)">${m[1]?eur(m[1]):''}</span><span class="b ${i===5?'l':''}" style="height:${Math.max(4,m[1]/mx*110)}px"></span>${m[0]}</div>`).join('')}</div></div>`
  +sec('Letzte Direktverkaufsprovisionen',COMMISSIONS.length,'Jede Zeile zeigt die Herleitung: Bestellwert netto × Provision in % = deine Provision.')
  +`<div class="rows">${COMMISSIONS.map(commCard).join('')}</div>`
};
const bigsec=(t,sub)=>`<div class="bigsec"><h2>${t}</h2></div>${sub?`<p class="sub">${sub}</p>`:''}`;
const payBtn=w=>`<button class="btn paybtn" onclick="toast('Auszahlung der ${w} beantragt (Demo)')">${ic('bank')} Auszahlung beantragen</button>`;
const directStats=()=>`<div class="grid g4">${stat('o','box','Bestellungen gesamt',ORDERS.length)}${stat('','wallet','Einnahmen gesamt',eur(totalComm),'<div class="trend">↑ ggü. Vormonat</div>')}${stat('c','users','Kunden',CUSTOMERS.length)}${stat('hl','bank','Direktverkaufs&shy;provision auszahlbar',eur(available),payBtn('Direktverkaufsprovision'))}</div>`;
const netStats=()=>`<div class="grid g4">${stat('o','box','Bestellungen gesamt',NET_COMMISSIONS.length)}${stat('','wallet','Einnahmen gesamt',eur(csum(NET_COMMISSIONS)))}${stat('c','users','Kunden',new Set(NET_COMMISSIONS.map(c=>c.kunde)).size)}${stat('hl','bank','Netzwerk&shy;provision auszahlbar',eur(netAvail()),payBtn('Netzwerkprovision'))}</div>`;
const netAvail=()=>NET_COMMISSIONS.filter(c=>c.status!=="Paid out").reduce((s,c)=>s+c.amt,0);

function netCard(c,showP=true){return `<div class="ocard comm" onclick="location.hash='#partner-${c.partner.id}'"><div class="lead"><span class="lic">${ic('box')}</span><div style="min-width:0"><div class="t">${c.prod}</div><div class="ocust">${ic('user')} ${c.kunde}, ${c.ort}${showP?` · über ${c.partner.name}`:''}</div>${calcLine(c.net,c.pct,c.amt,c.lvl)}</div></div><div class="r">${stDate(c)}</div></div>`}

const lastOrd=p=>{const cs=NET_COMMISSIONS.filter(c=>c.partner===p);return cs.length?'Letzte Bestellung '+ago(cs[0].date):'Noch keine Bestellung'};
function partnerRow(p){const cs=NET_COMMISSIONS.filter(c=>c.partner===p);
